</style><h1>Pourquoi Paris recule</h1><p class="lede">La part parisienne du réseau baisse à chaque période. Ce n&#x27;est pas une perte de centralité — le degré relatif d&#x27;une entreprise parisienne ne bouge pas — mais un effet de composition, porté par les entrées ; et ce qu&#x27;« entrer » veut dire change en cours de route.</p><button onclick="document.documentElement.dataset.theme=document.documentElement.dataset.theme==='dark'?'light':'dark'">Basculer le thème</button><figure id="fig59_paris_composition"><h2 style="font-size:16px;margin:0 0 2px">Paris recule par composition, pas par perte de centralité</h2><figcaption>À gauche, la part des liens traçables qui touchent Paris tombe de 63.5 % à 26.2 %, et la part des entreprises actives situées à Paris de 36.0 % à 12.1 % : les deux courbes descendent ensemble. À droite, le degré moyen d&#x27;une entreprise parisienne rapporté à celui des autres entreprises situées reste entre 1.16× et 1.39×, sans tendance. Une entreprise parisienne des années 1960 est aussi bien connectée, relativement, qu&#x27;une entreprise parisienne des années 1890. Paris n&#x27;a pas cessé d&#x27;être un moyeu ; le fonds a cessé d&#x27;être parisien.</figcaption><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1340 376" width="1340" height="376" role="img" aria-label="Paris recule par composition, pas par perte de centralité"><title>Paris recule par composition, pas par perte de centralité</title><rect width="1340" height="376" fill="var(--surface)"/><line x1="58.0" y1="298.0" x2="610.0" y2="298.0" stroke="var(--hairline)" stroke-width="0.8"/><text x="50.0" y="301.6" text-anchor="end" font-size="10.5" fill="var(--text-secondary)">0%</text><line x1="58.0" y1="235.5" x2="610.0" y2="235.5" stroke="var(--hairline)" stroke-width="0.8"/><text x="50.0" y="239.1" text-anchor="end" font-size="10.5" fill="var(--text-secondary)">25%</text><line x1="58.0" y1="173.0" x2="610.0" y2="173.0" stroke="var(--hairline)" stroke-width="0.8"/><text x="50.0" >1.5×</text><line x1="770.0" y1="48.0" x2="1322.0" y2="48.0" stroke="var(--hairline)" stroke-width="0.8"/><text x="762.0" y="51.6" text-anchor="end" font-size="10.5" fill="var(--text-secondary)">2.0×</text><text x="825.2" y="316.0" text-anchor="middle" font-size="10.5" fill="var(--text-secondary)">avant 1914</text><text x="935.6" y="316.0" text-anchor="middle" font-size="10.5" fill="var(--text-secondary)">1914–1929</text><text x="1046.0" y="316.0" text-anchor="middle" font-size="10.5" fill="var(--text-secondary)">1930–1944</text><text x="1156.4" y="316.0" text-anchor="middle" font-size="10.5" fill="var(--text-secondary)">1945–1962</text><text x="1266.8" y="316.0" text-anchor="middle" font-size="10.5" fill="var(--text-secondary)">après 1962</text><text x="770.0" y="26.0" text-anchor="start" font-size="12.5" fill="var(--text-secondary)">Connectivité relative de Paris, qui ne baisse pas</text><line x1="805.2" y1="173.0" x2="1286.8" y2="173.0" stroke="var(--other)" stroke-width="1.4" stroke-dasharray="5 4"/><text x="1290.8" y="176.6" text-anchor="start" font-size="10" fill="var(--text-secondary)">parité</text><path d="M825.2 141.1L935.6 133.7L1046.0 124.8L1156.4 153.0L1266.8 146.6" fill="none" stroke="var(--s2)" stroke-width="2" stroke-linejoin="round"/><circle cx="825.2" cy="141.1" r="4.2" fill="var(--s2)" stroke="var(--surface)" stroke-width="2"/><circle cx="935.6" cy="133.7" r="4.2" fill="var(--s2)" stroke="var(--surface)" stroke-width="2"/><circle cx="1046.0" cy="124.8" r="4.2" fill="var(--s2)" stroke="var(--surface)" stroke-width="2"/><circle cx="1156.4" cy="153.0" r="4.2" fill="var(--s2)" stroke="var(--surface)" stroke-width="2"/><circle cx="1266.8" cy="146.6" r="4.2" fill="var(--s2)" stroke="var(--surface)" stroke-width="2"/><text x="825.2" y="129.1" text-anchor="middle" font-size="10.5" font-weight="400" font-family="ui-sans-serif,system-ui,sans-serif" fill="var(--text-primary)" stroke="var(--surface)" stroke-width="3.0" stroke-linejoin="round" paint-order="stroke">1.25×</text><text x="1266.8" y="134.6" text-anchor="middle" font-size="10.5" font-weight="400" font-family="ui-sans-serif,system-ui,sans-serif" fill="var(--text-primary)" stroke="var(--surface)" stroke-width="3.0" stroke-linejoin="round" paint-order="stroke">1.21×</text><g font-size="12.5" font-family="ui-sans-serif,system-ui,sans-serif" fill="var(--text-secondary)"><circle cx="5.0" cy="355.8" r="5" fill="var(--s1)"/><text x="16.0" y="360.0">part des liens</text><circle cx="139.2" cy="355.8" r="5" fill="var(--s3)"/><text x="150.2" y="360.0">part des entreprises</text><circle cx="320.2" cy="355.8" r="5" fill="var(--s2)"/><text x="331.2" y="360.0">degré relatif (échelle de droite)</text></g></svg><details><summary>Voir les données</summary><table><thead><tr><th>Période</th><th class="num">Entreprises</th><th class="num">Paris</th><th class="num">% entreprises</th><th class="num">% liens</th><th class="num">Degré Paris</th><th class="num">Degré autres</th><th class="num">Rapport</th></tr></thead><tbody><tr><td>avant 1914</td><td class="num">864</td><td class="num">311</td><td class="num">36.0%</td><td class="num">63.5%</td><td class="num">8.839</td><td class="num">7.043</td><td class="num">1.25×</td></tr><tr><td>1914–1929</td><td class="num">1,753</td><td class="num">459</td><td class="num">26.2%</td><td class="num">51.4%</td><td class="num">15.939</td><td class="num">12.124</td><td class="num">1.31×</td></tr><tr><td>1930–1944</td><td class="num">1,463</td><td class="num">279</td><td class="num">19.1%</td><td class="num">40.7%</td><td class="num">14.477</td><td class="num">10.445</td><td class="num">1.39×</td></tr><tr><td>1945–1962</td><td class="num">887</td><td class="num">170</td><td class="num">19.2%</td><td class="num">36.9%</td><td class="num">10.071</td><td class="num">8.683</td><td class="num">1.16×</td></tr><tr><td>après 1962</td><td class="num">265</td><td class="num">32</td><td class="num">12.1%</td><td class="num">26.2%</td><td class="num">5.062</td><td class="num">4.180</td><td class="num">1.21×</td></tr></tbody></table></details></figure><figure id="fig60_paris_entry_exit"><h2 style="font-size:16px;margin:0 0 2px">Ce sont les entrées qui déplacent le réseau — et elles changent de sens</h2><figcaption>À gauche : à chaque transition, les entreprises qui arrivent sont bien moins parisiennes que le stock qu&#x27;elles rejoignent (22.5 % contre 36.0 % d&#x27;abord, 7.8 % contre 19.2 % à la fin), tandis que celles qui sortent ressemblent au stock. Rien ne chasse Paris ; quelque chose de non parisien arrive. Une entreprise n&#x27;a qu&#x27;un seul point d&#x27;ancrage pour toute la période couverte, donc la composition ne peut changer que par entrée et sortie : c&#x27;est une contrainte du jeu de données, pas un résultat. À droite : la part des entrants réellement fondés dans la période où ils apparaissent s&#x27;effondre de 81 % à 2 %. Au début ce sont de vraies créations ; à la fin ce sont de vieilles entreprises dont le compilateur parle enfin. Les trois barres montrent que la chute tient dans chaque strate, donc qu&#x27;elle n&#x27;est pas un artefact du champ « année de fondation », mieux rempli en métropole.</figcaption><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1340 392" width="1340" height="392" role="img" aria-label="Ce sont les entrées qui déplacent le réseau — et elles changent de sens"><title>Ce sont les entrées qui déplacent le réseau — et elles changent de sens</title><rect width="1340" height="392" fill="var(--surface)"/><line x1="58.0" y1="298.0" x2="610.0" y2="298.0" stroke="var(--hairline)" stroke-width="0.8"/><text x="50.0" y="301.6" text-anchor="end" font-size="10.5" fill="var(--text-secondary)">0%</text><line x1="58.0" y1="235.5" x2="610.0" y2="235.5" stroke="var(--hairline)" stroke-width="0.8"/><text x="50.0" y="239.1" text-anchor="end" font-size="10.5" fill="var(--text-secondary)">10%</text><line x1="58.0" y1="173.0" x2="610.0" y2="173.0" stroke="var(--hairline)" stroke-width="0.8"/><te
