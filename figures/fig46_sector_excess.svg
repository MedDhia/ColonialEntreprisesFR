y="601.5">la banque (conseil médian 10) paraît connectée pour cette raison autant que pour une autre. L&#x27;écart réordonne le tableau : la presse et l&#x27;hôtellerie, conseils médians de 1 et 2, sont les secteurs les plus connectés une</text><text x="0" y="616.5">fois la taille neutralisée. Le modèle nul est volontairement grossier — il suppose les sièges interchangeables — et sert d&#x27;étalon de lecture, non de modèle.</text></g></svg>