</g><g font-size="12.5" font-family="ui-sans-serif,system-ui,sans-serif" fill="#52514e"><circle cx="5.0" cy="637.8" r="5" fill="#2a78d6"/><text x="16.0" y="642.0">Maroc</text><circle cx="87.9" cy="637.8" r="5" fill="#eb6834"/><text x="98.9" y="642.0">Indochine</text><circle cx="195.2" cy="637.8" r="5" fill="#1baf7a"/><text x="206.2" y="642.0">Afrique occidentale française</text><circle cx="434.8" cy="637.8" r="5" fill="#a9a8a2"/><text x="445.8" y="642.0">autre territoire</text></g><g font-size="11.5" font-family="ui-sans-serif,system-ui,sans-serif" fill="#8a8983"><text x="0" y="673.5">Les 14 plus grandes communautés de Louvain, chacune un nœud dont l&#x27;aire est son nombre de firmes et la couleur son territoire dominant ; l&#x27;épaisseur d&#x27;un lien est le nombre d&#x27;administrateurs partagés entre deux</text><text x="0" y="688.5">communautés. Modularité 0,49 — une partition réelle, mais aucun bloc n&#x27;est isolé : le réseau se regroupe sans se cliver. Le territoire dominant est calculé hors « Empire (transversal) », qui est le label majoritaire</text><text x="0" y="703.5">presque partout et n&#x27;est pas un territoire mais l&#x27;aveu que la source n&#x27;en désigne aucun.</text></g></svg>