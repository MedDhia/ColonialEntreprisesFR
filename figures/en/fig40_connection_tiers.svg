<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1340 338" width="1340" height="338" role="img" aria-label="fig. 40 — Political connection, by tier"><title>fig. 40 — Political connection, by tier</title><rect width="1340" height="338" fill="#fcfcfb"/><text x="46.0" y="12.0" text-anchor="start" font-size="10.5" fill="#8a8983">Not plotted: 4,226 firms (65%) with no connection attested, of which 3,267 share a director with a connected firm.</text><g class="mk"><title>Executive: 890 / 6,475 (13.7%)</title><rect x="141.2" y="26.0" width="127.0" height="240.0" rx="4" fill="#2a78d6"/></g><text x="204.8" y="20.0" text-anchor="middle" font-size="10.5" fill="#52514e">890</text><text x="204.8" y="281.0" text-anchor="middle" font-size="10.5" fill="#52514e">Executive</text><g class="mk"><title>Legislature: 711 / 6,475 (11.0%)</title><rect x="458.8" y="74.3" width="127.0" height="191.7" rx="4" fill="#2a78d6"/></g><text x="522.2" y="68.3" text-anchor="middle" font-size="10.5" fill="#52514e">711</text><text x="522.2" y="281.0" text-anchor="middle" font-size="10.5" fill="#52514e">Legislature</text><g class="mk"><title>Administration: 500 / 6,475 (7.7%)</title><rect x="776.2" y="131.2" width="127.0" height="134.8" rx="4" fill="#1baf7a"/></g><text x="839.8" y="125.2" text-anchor="middle" font-size="10.5" fill="#52514e">500</text><text x="839.8" y="281.0" text-anchor="middle" font-size="10.5" fill="#52514e">Administration</text><g class="mk"><title>Local or proxy: 148 / 6,475 (2.3%)</title><rect x="1093.8" y="226.1" width="127.0" height="39.9" rx="4" fill="#1baf7a"/></g><text x="1157.2" y="220.1" text-anchor="middle" font-size="10.5" fill="#52514e">148</text><text x="1157.2" y="281.0" text-anchor="middle" font-size="10.5" fill="#52514e">Local or proxy</text><line x1="46.0" y1="266.0" x2="1316.0" y2="266.0" stroke="#e6e5e1" stroke-width="1"/><g font-size="11.5" font-family="ui-sans-serif,system-ui,sans-serif" fill="#8a8983"><text x="0" y="315.5">The 6,475 companies with at least one observed board seat. 2,249 (35%) have a director attested in public office. Of the 4,226 with no connection of their own, 3,267 share a director with a connected firm: indirect</text><text x="0" y="330.5">connection is deliberately not counted in the tier — one interlock from a minister&#x27;s board is not the same thing as having the minister on yours.</text></g></svg>