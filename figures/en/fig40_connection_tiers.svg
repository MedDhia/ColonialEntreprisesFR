<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1340 338" width="1340" height="338" role="img" aria-label="fig. 40 — Political connection, by tier"><title>fig. 40 — Political connection, by tier</title><rect width="1340" height="338" fill="#fcfcfb"/><text x="46.0" y="12.0" text-anchor="start" font-size="10.5" fill="#8a8983">Not plotted: 4,211 firms (65%) with no connection attested, of which 3,254 share a director with a connected firm.</text><g class="mk"><title>Executive: 884 / 6,454 (13.7%)</title><rect x="141.2" y="26.0" width="127.0" height="240.0" rx="4" fill="#2a78d6"/></g><text x="204.8" y="20.0" text-anchor="middle" font-size="10.5" fill="#52514e">884</text><text x="204.8" y="281.0" text-anchor="middle" font-size="10.5" fill="#52514e">Executive</text><g class="mk"><title>Legislature: 713 / 6,454 (11.0%)</title><rect x="458.8" y="72.4" width="127.0" height="193.6" rx="4" fill="#2a78d6"/></g><text x="522.2" y="66.4" text-anchor="middle" font-size="10.5" fill="#52514e">713</text><text x="522.2" y="281.0" text-anchor="middle" font-size="10.5" fill="#52514e">Legislature</text><g class="mk"><title>Administration: 501 / 6,454 (7.8%)</title><rect x="776.2" y="130.0" width="127.0" height="136.0" rx="4" fill="#1baf7a"/></g><text x="839.8" y="124.0" text-anchor="middle" font-size="10.5" fill="#52514e">501</text><text x="839.8" y="281.0" text-anchor="middle" font-size="10.5" fill="#52514e">Administration</text><g class="mk"><title>Local or proxy: 145 / 6,454 (2.2%)</title><rect x="1093.8" y="226.6" width="127.0" height="39.4" rx="4" fill="#1baf7a"/></g><text x="1157.2" y="220.6" text-anchor="middle" font-size="10.5" fill="#52514e">145</text><text x="1157.2" y="281.0" text-anchor="middle" font-size="10.5" fill="#52514e">Local or proxy</text><line x1="46.0" y1="266.0" x2="1316.0" y2="266.0" stroke="#e6e5e1" stroke-width="1"/><g font-size="11.5" font-family="ui-sans-serif,system-ui,sans-serif" fill="#8a8983"><text x="0" y="315.5">The 6,454 companies with at least one observed board seat. 2,243 (35%) have a director attested in public office. Of the 4,211 with no connection of their own, 3,254 share a director with a connected firm: indirect</text><text x="0" y="330.5">connection is deliberately not counted in the tier — one interlock from a minister&#x27;s board is not the same thing as having the minister on yours.</text></g></svg>