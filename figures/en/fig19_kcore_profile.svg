d" font-size="11.0" fill="#8a8983">core number (k)</text><g font-size="12.5" font-family="ui-sans-serif,system-ui,sans-serif" fill="#52514e"><circle cx="5.0" cy="417.8" r="5" fill="#2a78d6"/><text x="16.0" y="422.0">ordinary shell</text><circle cx="142.6" cy="417.8" r="5" fill="#eb6834"/><text x="153.6" y="422.0">complete graph (artefact)</text></g><g font-size="11.5" font-family="ui-sans-serif,system-ui,sans-serif" fill="#8a8983"><text x="0" y="453.5">Firms per k-core shell: a firm is at level k if it has k neighbours that themselves have k. The profile should decay smoothly; it does not. Shells k=48, k=71 are</text><text x="0" y="468.5">*complete* graphs — every firm in them tied to every other, which no real board produces. They are merged notices and accumulated directorships, and this</text><text x="0" y="483.5">decomposition is the only thing that makes them visible. The empty levels between k=46 and k=71 are real: nothing occupies that band, so the deep core stands off from</text><text x="0" y="498.5">the rest of the graph. Figure 26 takes it apart.</text></g></svg>