</style><h1>Why Paris recedes</h1><p class="lede">Paris&#x27;s share of the network falls in every period. It is not a loss of centrality — a Paris firm&#x27;s relative degree does not move — but a compositional effect carried by arrivals; and what an arrival is changes along the way.</p><button onclick="document.documentElement.dataset.theme=document.documentElement.dataset.theme==='dark'?'light':'dark'">Toggle theme</button><figure id="fig59_paris_composition"><h2 style="font-size:16px;margin:0 0 2px">Paris recedes by composition, not by losing centrality</h2><figcaption>Left: the share of drawable ties touching Paris falls from 63.5% to 26.2%, and Paris&#x27;s share of the active firms from 36.0% to 12.1% — the two fall together. Right: the mean degree of a Paris firm over the mean degree of every other placed firm stays between 1.16× and 1.39×, with no trend. A Paris firm in the 1960s is as disproportionately connected as a Paris firm in the 1890s. Paris did not stop being a hub; the record stopped being Parisian.</figcaption><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1340 376" width="1340" height="376" role="img" aria-label="Paris recedes by composition, not by losing centrality"><title>Paris recedes by composition, not by losing centrality</title><rect width="1340" height="376" fill="var(--surface)"/><line x1="58.0" y1="298.0" x2="610.0" y2="298.0" stroke="var(--hairline)" stroke-width="0.8"/><text x="50.0" y="301.6" text-anchor="end" font-size="10.5" fill="var(--text-secondary)">0%</text><line x1="58.0" y1="235.5" x2="610.0" y2="235.5" stroke="var(--hairline)" stroke-width="0.8"/><text x="50.0" y="239.1" text-anchor="end" font-size="10.5" fill="var(--text-secondary)">25%</text><line x1="58.0" y1="173.0" x2="610.0" y2="173.0" stroke="var(--hairline)" stroke-width="0.8"/><text x="50.0" y="176.6" text-anchor="end" font-size="10.5" fill="var(--text-secondary)">50%</text><line x1="58.0" y1="110.5" x2="610.0" y2="110.5" stroke="var(--hairline)" stroke-wid ary)" stroke="var(--surface)" stroke-width="3.0" stroke-linejoin="round" paint-order="stroke">1.21×</text><g font-size="12.5" font-family="ui-sans-serif,system-ui,sans-serif" fill="var(--text-secondary)"><circle cx="5.0" cy="355.8" r="5" fill="var(--s1)"/><text x="16.0" y="360.0">share of ties</text><circle cx="131.4" cy="355.8" r="5" fill="var(--s3)"/><text x="142.4" y="360.0">share of firms</text><circle cx="267.4" cy="355.8" r="5" fill="var(--s2)"/><text x="278.4" y="360.0">relative degree (right panel)</text></g></svg><details><summary>Show the data</summary><table><thead><tr><th>Period</th><th class="num">Firms</th><th class="num">Paris</th><th class="num">% firms</th><th class="num">% ties</th><th class="num">Degree Paris</th><th class="num">Degree other</th><th class="num">Ratio</th></tr></thead><tbody><tr><td>pre-1914</td><td class="num">864</td><td class="num">311</td><td class="num">36.0%</td><td class="num">63.5%</td><td class="num">8.839</td><td class="num">7.043</td><td class="num">1.25×</td></tr><tr><td>1914–1929</td><td class="num">1,753</td><td class="num">459</td><td class="num">26.2%</td><td class="num">51.4%</td><td class="num">15.939</td><td class="num">12.124</td><td class="num">1.31×</td></tr><tr><td>1930–1944</td><td class="num">1,463</td><td class="num">279</td><td class="num">19.1%</td><td class="num">40.7%</td><td class="num">14.477</td><td class="num">10.445</td><td class="num">1.39×</td></tr><tr><td>1945–1962</td><td class="num">887</td><td class="num">170</td><td class="num">19.2%</td><td class="num">36.9%</td><td class="num">10.071</td><td class="num">8.683</td><td class="num">1.16×</td></tr><tr><td>post-1962</td><td class="num">265</td><td class="num">32</td><td class="num">12.1%</td><td class="num">26.2%</td><td class="num">5.062</td><td class="num">4.180</td><td class="num">1.21×</td></tr></tbody></table></details></figure><figure id="fig60_paris_entry_exit"><h2 style="font-size:16px;margin:0 0 2px">Arrivals move the network — and what an arrival is changes</h2><figcaption>Left: at every transition the arriving firms are far less Parisian than the stock they join — 22.5% against 36.0% at the start, 7.8% against 19.2% at the end — while the leavers look like the stock. Nothing pushes Paris out; something non-Parisian arrives. A firm carries one anchor for the whole period covered, so composition can change only by entry and exit: that is a constraint of the dataset, not a finding. Right: the share of arrivals actually founded in the period they arrive in collapses from 81% to 2%. Early on these are real new firms; at the end they are old firms the compiler is only now writing about. The three bars show the collapse holds inside each stratum, so it is not an artefact of the founding-year field being better recorded in the metropole.</figcaption><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1340 392" width="1340" height="392" role="img" aria-label="Arrivals move the network — and what an arrival is changes"><title>Arrivals move the network — and what an arrival is changes</title><rect width="1340" height="392" fill="var(--surface)"/><line x1="58.0" y1="298.0" x2="610.0" y2="298.0" stroke="var(--hairline)" stroke-width="0.8"/><text x="50.0" y="301.6" text-anchor="end" font-size="10.5" fill="var(--text-secondary)">0%</text><line x1="58.0" y1="235.5" x2="610.0" y2="235.5" stroke="var(--hairline)" stroke-width="0.8"/><text x="50.0" y="239.1" text-anchor="end" font-size="10.5" fill="var(--text-secondary)">10%</text><line x1="58.0" y1="173.0" x2="610.0" y2="173.0" stroke="var(--hairline)" stroke-width="0.8"/><text x="50.0" y="176.6" text-anchor="end" font-size="10.5" fill="var(--text-secondary)">20%</text><line x1="58.0" y1="110.5" x2="610.0" y2="110.5" stroke="var(--hairline)" stroke-width="0.8"/><text x="50.0" y="114.1" text-anchor="end" font-size="10.5" fill="var(--text-secondary)">30%</text><line x1="58.0" y1="48.0" x2="610.0" y2="48.0" stroke="var(--hairline)" stroke-width="0.8"/><text x="50
