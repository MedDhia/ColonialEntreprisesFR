></g><g font-size="11.5" font-family="ui-sans-serif,system-ui,sans-serif" fill="#8a8983"><text x="0" y="483.5">Complementary cumulative degree distribution, both axes logarithmic. Maximum degree falls from 495 to 158 once two shared directors are required instead of one:</text><text x="0" y="498.5">much of the full graph&#x27;s extreme connectivity is made of single-name edges. Both curves bend downward rather than running straight: the tail is shorter than a power</text><text x="0" y="513.5">law&#x27;s, so there is a characteristic scale — this network is not “scale-free”, and an exponent fitted to it would describe the source as much as the structure (figure 8).</text></g></svg>