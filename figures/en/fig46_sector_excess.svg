s connected partly for that reason. The gap reorders the table: press and hospitality, median boards of 1 and 2, are the most connected sectors once size is netted out. The null is deliberately</text><text x="0" y="616.5">crude — it treats seats as exchangeable — and is a yardstick for reading the raw shares, not a model.</text></g></svg>