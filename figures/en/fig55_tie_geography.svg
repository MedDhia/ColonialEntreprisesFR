<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1560 302" width="1560" height="302" role="img" aria-label="The geography of a tie"><title>The geography of a tie</title><rect width="1560" height="302" fill="#fcfcfb"/><text x="198.0" y="52.2" text-anchor="end" font-size="12.0" fill="#52514e">colony – colony</text><rect x="208.0" y="34.0" width="283.1" height="26" rx="0" fill="#eb6834"/><rect x="493.1" y="34.0" width="916.9" height="26" rx="4" fill="#2a78d6"/><text x="1419.0" y="52.2" text-anchor="start" font-size="11.5" fill="#52514e">20,546  (47.2%)</text><text x="198.0" y="98.2" text-anchor="end" font-size="12.0" fill="#52514e">metropole – colony</text><rect x="208.0" y="80.0" width="0.0" height="26" rx="0" fill="#eb6834"/><rect x="208.0" y="80.0" width="923.9" height="26" rx="4" fill="#2a78d6"/><text x="1142.9" y="98.2" text-anchor="start" font-size="11.5" fill="#52514e">15,827  (36.3%)</text><text x="198.0" y="144.2" text-anchor="end" font-size="12.0" fill="#52514e">metropole – metropole</text><rect x="208.0" y="126.0" width="245.7" height="26" rx="0" fill="#eb6834"/><rect x="455.7" y="126.0" width="46.0" height="26" rx="4" fill="#2a78d6"/><text x="510.6" y="144.2" text-anchor="start" font-size="11.5" fill="#52514e">5,019  (11.5%)</text><text x="198.0" y="190.2" text-anchor="end" font-size="12.0" fill="#52514e">with a foreign country</text><rect x="208.0" y="172.0" width="4.6" height="26" rx="0" fill="#eb6834"/><rect x="214.6" y="172.0" width="121.1" height="26" rx="4" fill="#2a78d6"/><text x="344.7" y="190.2" text-anchor="start" font-size="11.5" fill="#52514e">2,183  (5.0%)</text><g font-size="12.5" font-family="ui-sans-serif,system-ui,sans-serif" fill="#52514e"><circle cx="5.0" cy="243.8" r="5" fill="#eb6834"/><text x="16.0" y="248.0">within one place</text><circle cx="153.2" cy="243.8" r="5" fill="#2a78d6"/><text x="164.2" y="248.0">between two places</text></g><g font-size="11.5" font-family="ui-sans-serif,system-ui,sans-serif" fill="#8a8983"><text x="0" y="279.5">The 43,575 drawable ties, classified by their two endpoints. 9,117 of them (20.9%) never leave a single place, which is the inner segment; the median tie that does leave spans 3,083 km. Colony–colony leads, but 10,384 of those ties stay inside one</text><text x="0" y="294.5">territory and some of the firms involved are placed by filing country for want of an address, so read that rank as a ceiling.</text></g></svg>