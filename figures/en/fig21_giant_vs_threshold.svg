<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 418" width="1040" height="418" role="img" aria-label="What survives when one name is not enough"><title>What survives when one name is not enough</title><rect width="1040" height="418" fill="#fcfcfb"/><line x1="58.0" y1="346.0" x2="1028.0" y2="346.0" stroke="#e6e5e1" stroke-width="1"/><text x="50.0" y="349.6" text-anchor="end" font-size="11.0" fill="#8a8983">0%</text><line x1="58.0" y1="267.0" x2="1028.0" y2="267.0" stroke="#e6e5e1" stroke-width="1"/><text x="50.0" y="270.6" text-anchor="end" font-size="11.0" fill="#8a8983">25%</text><line x1="58.0" y1="188.0" x2="1028.0" y2="188.0" stroke="#e6e5e1" stroke-width="1"/><text x="50.0" y="191.6" text-anchor="end" font-size="11.0" fill="#8a8983">50%</text><line x1="58.0" y1="109.0" x2="1028.0" y2="109.0" stroke="#e6e5e1" stroke-width="1"/><text x="50.0" y="112.6" text-anchor="end" font-size="11.0" fill="#8a8983">75%</text><line x1="58.0" y1="30.0" x2="1028.0" y2="30.0" stroke="#e6e5e1" stroke-width="1"/><text x="50.0" y="33.6" text-anchor="end" font-size="11.0" fill="#8a8983">100%</text><g class="mk"><title>w ≥ 1: 5 776 firms (98.5%), 76 893 edges</title><rect x="86.6" y="34.6" width="64.0" height="311.4" rx="4.0" fill="#2a78d6"/></g><text x="118.6" y="29.6" text-anchor="middle" font-size="10.5" fill="#52514e">98.5%</text><text x="118.6" y="361.0" text-anchor="middle" font-size="11.0" fill="#8a8983">1</text><g class="mk"><title>w ≥ 2: 2 780 firms (47.4%), 12 218 edges</title><rect x="207.9" y="196.1" width="64.0" height="149.9" rx="4.0" fill="#2a78d6"/></g><text x="239.9" y="191.1" text-anchor="middle" font-size="10.5" fill="#52514e">47.4%</text><text x="239.9" y="361.0" text-anchor="middle" font-size="11.0" fill="#8a8983">2</text><g class="mk"><title>w ≥ 3: 1 560 firms (26.6%), 4 866 edges</title><rect x="329.1" y="261.9" width="64.0" height="84.1" rx="4.0" fill="#2a78d6"/></g><text x="361.1" y="256.9" text-anchor="middle" font-size="10.5" fill="#52514e">26.6%</text><text x="361.1" y="361.0" text-anchor="middle" font-size="11.0" fill="#8a8983">3</text><g class="mk"><title>w ≥ 4: 919 firms (15.7%), 2 498 edges</title><rect x="450.4" y="296.5" width="64.0" height="49.5" rx="4.0" fill="#2a78d6"/></g><text x="482.4" y="291.5" text-anchor="middle" font-size="10.5" fill="#52514e">15.7%</text><text x="482.4" y="361.0" text-anchor="middle" font-size="11.0" fill="#8a8983">4</text><g class="mk"><title>w ≥ 5: 464 firms (7.9%), 1 446 edges</title><rect x="571.6" y="321.0" width="64.0" height="25.0" rx="4.0" fill="#2a78d6"/></g><text x="603.6" y="316.0" text-anchor="middle" font-size="10.5" fill="#52514e">7.9%</text><text x="603.6" y="361.0" text-anchor="middle" font-size="11.0" fill="#8a8983">5</text><g class="mk"><title>w ≥ 6: 218 firms (3.7%), 875 edges</title><rect x="692.9" y="334.2" width="64.0" height="11.8" rx="4.0" fill="#2a78d6"/></g><text x="724.9" y="329.2" text-anchor="middle" font-size="10.5" fill="#52514e">3.7%</text><text x="724.9" y="361.0" text-anchor="middle" font-size="11.0" fill="#8a8983">6</text><g class="mk"><title>w ≥ 7: 54 firms (0.9%), 569 edges</title><rect x="814.1" y="343.1" width="64.0" height="2.9" rx="4.0" fill="#2a78d6"/></g><text x="846.1" y="338.1" text-anchor="middle" font-size="10.5" fill="#52514e">0.9%</text><text x="846.1" y="361.0" text-anchor="middle" font-size="11.0" fill="#8a8983">7</text><g class="mk"><title>w ≥ 8: 17 firms (0.3%), 370 edges</title><rect x="935.4" y="345.1" width="64.0" height="1.0" rx="4.0" fill="#2a78d6"/></g><text x="967.4" y="340.1" text-anchor="middle" font-size="10.5" fill="#52514e">0.3%</text><text x="967.4" y="361.0" text-anchor="middle" font-size="11.0" fill="#8a8983">8</text><line x1="58.0" y1="346.0" x2="1028.0" y2="346.0" stroke="#e6e5e1" stroke-width="1"/><text x="0.0" y="11.0" text-anchor="start" font-size="11.0" fill="#8a8983">share of firms in the giant component</text><text x="1028.0" y="376.0" text-anchor="end" font-size="11.0" fill="#8a8983">shared directors required</text><g font-size="11.5" font-family="ui-sans-serif,system-ui,sans-serif" fill="#8a8983"><text x="0" y="395.5">Giant component against the weight threshold. At one shared director 98.5% of firms form a single component; at two, 47.4%. The “connected” network of figure 4 is</text><text x="0" y="410.5">therefore held together by single-name edges, each of which vanishes on one entity-resolution error. Any component or distance analysis has to state its threshold.</text></g></svg>