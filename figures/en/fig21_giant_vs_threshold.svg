ext><text x="361.1" y="361.0" text-anchor="middle" font-size="11.0" fill="#8a8983">3</text><g class="mk"><title>w ≥ 4: 959 firms (16.0%), 2 595 edges</title><rect x="450.4" y="295.4" width="64.0" height="50.6" rx="4.0" fill="#2a78d6"/></g><text x="482.4" y="290.4" text-anchor="middle" font-size="10.5" fill="#52514e">16%</text><text x="482.4" y="361.0" text-anchor="middle" font-size="11.0" fill="#8a8983">4</text><g class="mk"><title>w ≥ 5: 477 firms (8.0%), 1 483 edges</title><rect x="571.6" y="320.8" width="64.0" height="25.2" rx="4.0" fill="#2a78d6"/></g><text x="603.6" y="315.8" text-anchor="middle" font-size="10.5" fill="#52514e">8%</text><text x="603.6" y="361.0" text-anchor="middle" font-size="11.0" fill="#8a8983">5</text><g class="mk"><title>w ≥ 6: 162 firms (2.7%), 883 edges</title><rect x="692.9" y="337.5" width="64.0" height="8.5" rx="4.0" fill="#2a78d6"/></g><text x="724.9" y="332.5" text-anchor="middle" font-size="10.5" fill="#52514e">2.7%</text><text x="724.9" y="361.0" text-anchor="middle" font-size="11.0" fill="#8a8983">6</text><g class="mk"><title>w ≥ 7: 50 firms (0.8%), 576 edges</title><rect x="814.1" y="343.4" width="64.0" height="2.6" rx="4.0" fill="#2a78d6"/></g><text x="846.1" y="338.4" text-anchor="middle" font-size="10.5" fill="#52514e">0.8%</text><text x="846.1" y="361.0" text-anchor="middle" font-size="11.0" fill="#8a8983">7</text><g class="mk"><title>w ≥ 8: 18 firms (0.3%), 379 edges</title><rect x="935.4" y="345.1" width="64.0" height="1.0" rx="4.0" fill="#2a78d6"/></g><text x="967.4" y="340.1" text-anchor="middle" font-size="10.5" fill="#52514e">0.3%</text><text x="967.4" y="361.0" text-anchor="middle" font-size="11.0" fill="#8a8983">8</text><line x1="58.0" y1="346.0" x2="1028.0" y2="346.0" stroke="#e6e5e1" stroke-width="1"/><text x="0.0" y="11.0" text-anchor="start" font-size="11.0" fill="#8a8983">share of firms in the giant component</text><text x="1028.0" y="376.0" text-anchor="end" font-size="11.0" fill="#8a8983">shared directors required</text><g font-size="11.5" font-family="ui-sans-serif,system-ui,sans-serif" fill="#8a8983"><text x="0" y="395.5">Giant component against the weight threshold. At one shared director 98.6% of firms form a single component; at two, 48.8%. The “connected” network of figure 4 is</text><text x="0" y="410.5">therefore held together by single-name edges, each of which vanishes on one entity-resolution error. Any component or distance analysis has to state its threshold.</text></g></svg>