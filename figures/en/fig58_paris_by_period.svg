Paris</text><text x="872.0" y="24.0" text-anchor="start" font-size="12.5" fill="#52514e">Share of the period&#x27;s firms that can be placed</text><g font-size="12.5" font-family="ui-sans-serif,system-ui,sans-serif" fill="#52514e"><circle cx="5.0" cy="353.8" r="5" fill="#2a78d6"/><text x="16.0" y="358.0">all placed firms</text><circle cx="149.8" cy="353.8" r="5" fill="#1baf7a"/><text x="160.8" y="358.0">street address only</text><circle cx="323.1" cy="353.8" r="5" fill="#eb6834"/><text x="334.1" y="358.0">coverage below 50%</text></g><g font-size="11.5" font-family="ui-sans-serif,system-ui,sans-serif" fill="#8a8983"><text x="0" y="389.5">Left: Paris&#x27;s share falls in every period, from 63.4% to 26.1%. The second line recomputes it on firms with a street address alone — where position is a fact about the firm rather than about the catalogue&#x27;s filing — and the trend survives: 82.7% to 42.1%.</text><text x="0" y="404.5">Right: the reason to be careful anyway. Coverage collapses in 1945–1962, where 1,486 of the active firms are filed under the transversal *Empire* rubric with no country at all. That panel is a thinner sample, not a thinner network.</text></g></svg>