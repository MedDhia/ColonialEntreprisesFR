</g><g font-size="12.5" font-family="ui-sans-serif,system-ui,sans-serif" fill="#52514e"><circle cx="5.0" cy="637.8" r="5" fill="#2a78d6"/><text x="16.0" y="642.0">Morocco</text><circle cx="103.6" cy="637.8" r="5" fill="#eb6834"/><text x="114.6" y="642.0">Indochina</text><circle cx="210.9" cy="637.8" r="5" fill="#1baf7a"/><text x="221.9" y="642.0">Algeria</text><circle cx="302.6" cy="637.8" r="5" fill="#a9a8a2"/><text x="313.6" y="642.0">other territory</text></g><g font-size="11.5" font-family="ui-sans-serif,system-ui,sans-serif" fill="#8a8983"><text x="0" y="673.5">The 14 largest Louvain communities, each a node whose area is its firm count and whose colour is its dominant territory; edge width is the number of shared directors between two communities. Modularity 0.48 — a real</text><text x="0" y="688.5">partition, but no block stands apart: the network clusters without cleaving. The dominant territory is taken excluding “Empire (transversal)”, which is the majority label almost everywhere and is not a territory but the</text><text x="0" y="703.5">source&#x27;s admission that it names none.</text></g></svg>