1baf7a"/><text x="1091.0" y="316.0" text-anchor="middle" font-size="8.5" fill="#52514e">all</text><text x="1091.0" y="244.6" text-anchor="middle" font-size="10.5" font-weight="400" font-family="ui-sans-serif,system-ui,sans-serif" fill="#0b0b0b" stroke="#fcfcfb" stroke-width="3.0" stroke-linejoin="round" paint-order="stroke">19%</text><rect x="1104.0" y="280.1" width="22.0" height="17.9" rx="3" fill="#1baf7a"/><text x="1115.0" y="316.0" text-anchor="middle" font-size="8.5" fill="#52514e">metro</text><rect x="1128.0" y="243.8" width="22.0" height="54.2" rx="3" fill="#1baf7a"/><text x="1139.0" y="316.0" text-anchor="middle" font-size="8.5" fill="#52514e">emp.</text><rect x="1218.0" y="294.0" width="22.0" height="4.0" rx="3" fill="#1baf7a"/><text x="1229.0" y="316.0" text-anchor="middle" font-size="8.5" fill="#52514e">all</text><text x="1229.0" y="288.0" text-anchor="middle" font-size="10.5" font-weight="400" font-family="ui-sans-serif,system-ui,sans-serif" fill="#0b0b0b" stroke="#fcfcfb" stroke-width="3.0" stroke-linejoin="round" paint-order="stroke">2%</text><rect x="1242.0" y="298.0" width="22.0" height="0.0" rx="3" fill="#1baf7a"/><text x="1253.0" y="316.0" text-anchor="middle" font-size="8.5" fill="#52514e">metro</text><rect x="1266.0" y="293.1" width="22.0" height="4.9" rx="3" fill="#1baf7a"/><text x="1277.0" y="316.0" text-anchor="middle" font-size="8.5" fill="#52514e">emp.</text><g font-size="12.5" font-family="ui-sans-serif,system-ui,sans-serif" fill="#52514e"><circle cx="5.0" cy="371.8" r="5" fill="#a9a8a2"/><text x="16.0" y="376.0">standing stock</text><circle cx="142.6" cy="371.8" r="5" fill="#eb6834"/><text x="153.6" y="376.0">leavers</text><circle cx="235.9" cy="371.8" r="5" fill="#2a78d6"/><text x="246.9" y="376.0">arrivals</text><circle cx="333.5" cy="371.8" r="5" fill="#1baf7a"/><text x="344.5" y="376.0">founded in-period (right panel)</text></g><g font-size="11.5" font-family="ui-sans-serif,system-ui,sans-serif" fill="#8a8983"><text x="0" y="407.5">Left: at every transition the arriving firms are far less Parisian than the stock they join — 22.5% against 36.0% at the start, 7.8% against 19.2% at the end — while the leavers look like the stock. Nothing pushes Paris</text><text x="0" y="422.5">out; something non-Parisian arrives. A firm carries one anchor for the whole period covered, so composition can change only by entry and exit: that is a constraint of the dataset, not a finding. Right: the share of</text><text x="0" y="437.5">arrivals actually founded in the period they arrive in collapses from 81% to 2%. Early on these are real new firms; at the end they are old firms the compiler is only now writing about. The three bars show the collapse</text><text x="0" y="452.5">holds inside each stratum, so it is not an artefact of the founding-year field being better recorded in the metropole.</text></g></svg>