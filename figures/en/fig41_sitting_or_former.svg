<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1340 376" width="1340" height="376" role="img" aria-label="fig. 41 — Sitting, or former"><title>fig. 41 — Sitting, or former</title><rect width="1340" height="376" fill="#fcfcfb"/><g class="mk"><title>Executive — sitting: 864</title><rect x="115.8" y="26.0" width="69.8" height="240.0" rx="4" fill="#2a78d6"/></g><text x="150.8" y="20.0" text-anchor="middle" font-size="10.5" fill="#52514e">864</text><g class="mk"><title>Executive — former: 478</title><rect x="198.4" y="133.2" width="69.8" height="132.8" rx="4" fill="#eb6834"/></g><text x="233.3" y="127.2" text-anchor="middle" font-size="10.5" fill="#52514e">478</text><text x="204.8" y="281.0" text-anchor="middle" font-size="10.5" fill="#52514e">Executive</text><g class="mk"><title>Legislature — sitting: 711</title><rect x="433.4" y="68.5" width="69.8" height="197.5" rx="4" fill="#2a78d6"/></g><text x="468.3" y="62.5" text-anchor="middle" font-size="10.5" fill="#52514e">711</text><g class="mk"><title>Legislature — former: 35</title><rect x="515.9" y="256.3" width="69.8" height="9.7" rx="4" fill="#eb6834"/></g><text x="550.8" y="250.3" text-anchor="middle" font-size="10.5" fill="#52514e">35</text><text x="522.2" y="281.0" text-anchor="middle" font-size="10.5" fill="#52514e">Legislature</text><g class="mk"><title>Administration — sitting: 451</title><rect x="750.9" y="140.7" width="69.8" height="125.3" rx="4" fill="#2a78d6"/></g><text x="785.8" y="134.7" text-anchor="middle" font-size="10.5" fill="#52514e">451</text><g class="mk"><title>Administration — former: 115</title><rect x="833.4" y="234.1" width="69.8" height="31.9" rx="4" fill="#eb6834"/></g><text x="868.3" y="228.1" text-anchor="middle" font-size="10.5" fill="#52514e">115</text><text x="839.8" y="281.0" text-anchor="middle" font-size="10.5" fill="#52514e">Administration</text><g class="mk"><title>Local or proxy — sitting: 134</title><rect x="1068.3" y="228.8" width="69.8" height="37.2" rx="4" fill="#2a78d6"/></g><text x="1103.3" y="222.8" text-anchor="middle" font-size="10.5" fill="#52514e">134</text><g class="mk"><title>Local or proxy — former: 18</title><rect x="1150.9" y="261.0" width="69.8" height="5.0" rx="4" fill="#eb6834"/></g><text x="1185.8" y="255.0" text-anchor="middle" font-size="10.5" fill="#52514e">18</text><text x="1157.2" y="281.0" text-anchor="middle" font-size="10.5" fill="#52514e">Local or proxy</text><line x1="46.0" y1="266.0" x2="1316.0" y2="266.0" stroke="#e6e5e1" stroke-width="1"/><g font-size="12.5" font-family="ui-sans-serif,system-ui,sans-serif" fill="#52514e"><circle cx="5.0" cy="317.8" r="5" fill="#2a78d6"/><text x="16.0" y="322.0">sitting</text><circle cx="87.9" cy="317.8" r="5" fill="#eb6834"/><text x="98.9" y="322.0">former</text></g><g font-size="11.5" font-family="ui-sans-serif,system-ui,sans-serif" fill="#8a8983"><text x="0" y="353.5">A sitting office-holder on a board is a conflict of interest; a retired governor-general is a revolving door. The two are never summed and a firm can count in both. `former` is read from the source&#x27;s own words —</text><text x="0" y="368.5">*ancien*, *honoraire*, *en retraite* — which the compiler omits far more often than he omits the office itself: read the orange bars as a floor and the blue as a ceiling.</text></g></svg>