</style><h1>La forme du réseau, en dix mesures</h1><p class="lede">Une composante ou plusieurs, un cœur réel ou un artefact, un petit monde tenu par quoi. Ce que la topologie du graphe dit d&#x27;elle-même, avant qu&#x27;on lui fasse dire quoi que ce soit sur l&#x27;empire.</p><button onclick="document.documentElement.dataset.theme=document.documentElement.dataset.theme==='dark'?'light':'dark'">Basculer le thème</button><figure id="fig18_degree_distribution"><h2 style="font-size:16px;margin:0 0 2px">Distribution du degré</h2><figcaption>Distribution complémentaire cumulée du degré, en échelles logarithmiques. Le degré maximal passe de 499 à 164 lorsqu&#x27;on exige deux administrateurs partagés au lieu d&#x27;un : la connectivité extrême du graphe complet est en grande partie faite de liens à un seul nom. Les deux courbes s&#x27;infléchissent vers le bas plutôt que de suivre une droite : la queue est plus courte qu&#x27;une loi de puissance, il y a donc une échelle caractéristique — ce réseau n&#x27;est pas « sans échelle », et un exposant ajusté sur ces données décrirait la source autant que la structure (voir figure 8).</figcaption><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 468" width="1040" height="468" role="img" aria-label="Distribution du degré"><title>Distribution du degré</title><rect width="1040" height="468" fill="var(--surface)"/><line x1="58.0" y1="388.0" x2="826.0" y2="388.0" stroke="var(--hairline)" stroke-width="1"/><text x="50.0" y="391.6" text-anchor="end" font-size="11.0" fill="var(--text-muted)">0.01%</text><line x1="58.0" y1="295.0" x2="826.0" y2="295.0" stroke="var(--hairline)" stroke-width="1"/><text x="50.0" y="298.6" text-anchor="end" font-size="11.0" fill="var(--text-muted)">0.1%</text><line x1="58.0" y1="202.0" x2="826.0" y2="202.0" stroke="var(--hairline)" stroke-width="1"/><text x="50.0" y="205.6" text-anchor="end" font-size="11.0" fill="var(--text-muted)">1%</text><line x1="58.0" y1="109.0" x2="826.0" y2="109.0" stroke="va itoires ou plus</h2><figcaption>Les 34 personnes présentes dans au moins 8 territoires distincts ; les 18 qui détiennent le plus de sièges sont montrées, par identifiant tel qu&#x27;il figure dans le jeu de données. La barre est le nombre de firmes, le nombre après le point médian celui des territoires. 76 % des administrateurs n&#x27;apparaissent que dans un seul territoire : la poignée qui en couvre huit ou plus est l&#x27;ossature humaine de la figure 24. Trois de ces identifiants — « paris », « laurent », « a-paris-c » — sont des résidus d&#x27;extraction et non des personnes : un nom de famille seul que la résolution n&#x27;a pas pu rattacher, et un lieu pris pour un nom. Ils restent visibles ici plutôt que filtrés en silence, parce qu&#x27;un pseudo-acteur qui occupe une position structurale réelle est ce que le lecteur doit savoir.</figcaption><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 480" width="1040" height="480" role="img" aria-label="Portée individuelle : sièges de ceux qui couvrent 8 territoires ou plus"><title>Portée individuelle : sièges de ceux qui couvrent 8 territoires ou plus</title><rect width="1040" height="480" fill="var(--surface)"/><text x="250.0" y="12.0" text-anchor="start" font-size="11.0" fill="var(--text-muted)">sièges détenus · territoires après le point médian</text><g class="mk"><title>homberg-o: 72 firmes, 11 territoires — Afrique occidentale française, Afrique équatoriale française, Algerie, Algérie, Djibouti, Empire (transversal)</title><text x="240.0" y="38.3" text-anchor="end" font-size="11.0" fill="var(--text-secondary)">homberg-o · 11</text><rect x="250.0" y="26.0" width="716.0" height="15.0" rx="4" fill="var(--s1)"/><text x="973.0" y="38.3" text-anchor="start" font-size="10.5" fill="var(--text-secondary)">72</text></g><g class="mk"><title>guesde-p: 49 firmes, 8 territoires — Afrique occidentale française, Afrique équatoriale française, Algérie, Chine, Djibouti, Empire (transversal)</title><text x="240.0" y="63.3 omberg a réellement présidé un empire financier de cette taille ; la leçon n&#x27;est pas que la donnée est fausse, c&#x27;est que la structure la plus profonde du réseau est portée par un seul identifiant, et qu&#x27;une erreur de résolution sur ce nom la ferait disparaître.</figcaption><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1336 588" width="1336" height="588" role="img" aria-label="Le cœur le plus profond, moins un administrateur"><title>Le cœur le plus profond, moins un administrateur</title><rect width="1336" height="588" fill="var(--surface)"/><g transform="translate(8.0,0)"><g stroke="var(--edge)" fill="none">
