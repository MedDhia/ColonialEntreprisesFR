6" y="540.9" text-anchor="start" font-size="10.5" font-weight="400" font-family="ui-sans-serif,system-ui,sans-serif" fill="#0b0b0b" stroke="#fcfcfb" stroke-width="3.0" stroke-linejoin="round" paint-order="stroke">Plantations and commodity crops</text><text x="834.8" y="597.7" text-anchor="start" font-size="10.5" font-weight="400" font-family="ui-sans-serif,system-ui,sans-serif" fill="#0b0b0b" stroke="#fcfcfb" stroke-width="3.0" stroke-linejoin="round" paint-order="stroke">Construction and building materials</text><text x="685.9" y="617.6" text-anchor="start" font-size="10.5" font-weight="400" font-family="ui-sans-serif,system-ui,sans-serif" fill="#0b0b0b" stroke="#fcfcfb" stroke-width="3.0" stroke-linejoin="round" paint-order="stroke">Transcolonial and diversified groups</text><text x="506.3" y="597.7" text-anchor="end" font-size="10.5" font-weight="400" font-family="ui-sans-serif,system-ui,sans-serif" fill="#0b0b0b" stroke="#fcfcfb" stroke-width="3.0" stroke-linejoin="round" paint-order="stroke">Water, gas and electricity</text><text x="382.7" y="540.9" text-anchor="end" font-size="10.5" font-weight="400" font-family="ui-sans-serif,system-ui,sans-serif" fill="#0b0b0b" stroke="#fcfcfb" stroke-width="3.0" stroke-linejoin="round" paint-order="stroke">Wood, furniture and paper</text><text x="298.9" y="455.9" text-anchor="end" font-size="10.5" font-weight="400" font-family="ui-sans-serif,system-ui,sans-serif" fill="#0b0b0b" stroke="#fcfcfb" stroke-width="3.0" stroke-linejoin="round" paint-order="stroke">Land and real estate</text><text x="271.2" y="355.6" text-anchor="end" font-size="10.5" font-weight="400" font-family="ui-sans-serif,system-ui,sans-serif" fill="#0b0b0b" stroke="#fcfcfb" stroke-width="3.0" stroke-linejoin="round" paint-order="stroke">Textiles and leather</text><text x="300.8" y="255.3" text-anchor="end" font-size="10.5" font-weight="400" font-family="ui-sans-serif,system-ui,sans-serif" fill="#0b0b0b" stroke="#fcfcfb" stroke-width="3.0" stroke-linejoin="round" paint-order="stroke">Hotels and tourism</text><text x="384.8" y="170.3" text-anchor="end" font-size="10.5" font-weight="400" font-family="ui-sans-serif,system-ui,sans-serif" fill="#0b0b0b" stroke="#fcfcfb" stroke-width="3.0" stroke-linejoin="round" paint-order="stroke">Press, printing and communications</text><text x="510.6" y="113.5" text-anchor="end" font-size="10.5" font-weight="400" font-family="ui-sans-serif,system-ui,sans-serif" fill="#0b0b0b" stroke="#fcfcfb" stroke-width="3.0" stroke-linejoin="round" paint-order="stroke">Health, education and research</text><g font-size="12.5" font-family="ui-sans-serif,system-ui,sans-serif" fill="#52514e"><circle cx="5.0" cy="721.8" r="5" fill="#2a78d6"/><text x="16.0" y="726.0">moyeu (degré &gt; bétweenness)</text><circle cx="241.1" cy="721.8" r="5" fill="#eb6834"/><text x="252.1" y="726.0">courtier (bétweenness &gt; degré)</text></g><g font-size="11.5" font-family="ui-sans-serif,system-ui,sans-serif" fill="#8a8983"><text x="0" y="757.5">Les 16 secteurs, reliés par les interlocks entre leurs firmes ; les 60 paires les plus fortes sont tracées. L&#x27;aire du nœud est la part de bétweenness du réseau, et l&#x27;anneau est ordonné par elle : la finance vient en tête</text><text x="0" y="772.5">avec 30% de toutes les arêtes. La couleur sépare les moyeux des courtiers — un secteur dont les firmes se classent plus haut en degré qu&#x27;en bétweenness est un moyeu — et c&#x27;est la distinction que le classement brut</text><text x="0" y="787.5">masque. La finance est un moyeu ; les cinq courtiers sont le commerce, le bois, le textile, l&#x27;hôtellerie et la santé-enseignement, tous petits.</text></g></svg>