<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1340 429" width="1340" height="429" role="img" aria-label="Paris recule par composition, pas par perte de centralité"><title>Paris recule par composition, pas par perte de centralité</title><rect width="1340" height="429" fill="#fcfcfb"/><line x1="58.0" y1="298.0" x2="610.0" y2="298.0" stroke="#e6e5e1" stroke-width="0.8"/><text x="50.0" y="301.6" text-anchor="end" font-size="10.5" fill="#52514e">0%</text><line x1="58.0" y1="235.5" x2="610.0" y2="235.5" stroke="#e6e5e1" stroke-width="0.8"/><text x="50.0" y="239.1" text-anchor="end" font-size="10.5" fill="#52514e">25%</text><line x1="58.0" y1="173.0" x2="610.0" y2="173.0" stroke="#e6e5e1" stroke-width="0.8"/><text x="50.0" y="176.6" text-anchor="end" font-size="10.5" fill="#52514e">50%</text><line x1="58.0" y1="110.5" x2="610.0" y2="110.5" stroke="#e6e5e1" stroke-width="0.8"/><text x="50.0" y="114.1" text-anchor="end" font-size="10.5" fill="#52514e">75%</text><line x1="58.0" y1="48.0" x2="610.0" y2="48.0" stroke="#e6e5e1" stroke-width="0.8"/><text x="50.0" y="51.6" text-anchor="end" font-size="10.5" fill="#52514e">100%</text><text x="113.2" y="316.0" text-anchor="middle" font-size="10.5" fill="#52514e">avant 1914</text><text x="223.6" y="316.0" text-anchor="middle" font-size="10.5" fill="#52514e">1914–1929</text><text x="334.0" y="316.0" text-anchor="middle" font-size="10.5" fill="#52514e">1930–1944</text><text x="444.4" y="316.0" text-anchor="middle" font-size="10.5" fill="#52514e">1945–1962</text><text x="554.8" y="316.0" text-anchor="middle" font-size="10.5" fill="#52514e">après 1962</text><text x="58.0" y="26.0" text-anchor="start" font-size="12.5" fill="#52514e">Part parisienne, qui baisse</text><path d="M113.2 139.3L223.6 169.4L334.0 196.2L444.4 205.8L554.8 232.4" fill="none" stroke="#2a78d6" stroke-width="2" stroke-linejoin="round"/><circle cx="113.2" cy="139.3" r="4.2" fill="#2a78d6" stroke="#fcfcfb" stroke-width="2"/><circle cx="223.6" cy="169.4" r="4.2" fill="#2a78d6" stroke="#fcfcfb" stroke-width="2"/><circle cx="334.0" cy="196.2" r="4.2" fill="#2a78d6" stroke="#fcfcfb" stroke-width="2"/><circle cx="444.4" cy="205.8" r="4.2" fill="#2a78d6" stroke="#fcfcfb" stroke-width="2"/><circle cx="554.8" cy="232.4" r="4.2" fill="#2a78d6" stroke="#fcfcfb" stroke-width="2"/><text x="113.2" y="127.3" text-anchor="middle" font-size="10.5" font-weight="400" font-family="ui-sans-serif,system-ui,sans-serif" fill="#0b0b0b" stroke="#fcfcfb" stroke-width="3.0" stroke-linejoin="round" paint-order="stroke">63%</text><text x="554.8" y="220.4" text-anchor="middle" font-size="10.5" font-weight="400" font-family="ui-sans-serif,system-ui,sans-serif" fill="#0b0b0b" stroke="#fcfcfb" stroke-width="3.0" stroke-linejoin="round" paint-order="stroke">26%</text><path d="M113.2 208.0L223.6 232.5L334.0 250.3L444.4 250.1L554.8 267.8" fill="none" stroke="#1baf7a" stroke-width="2" stroke-linejoin="round"/><circle cx="113.2" cy="208.0" r="4.2" fill="#1baf7a" stroke="#fcfcfb" stroke-width="2"/><circle cx="223.6" cy="232.5" r="4.2" fill="#1baf7a" stroke="#fcfcfb" stroke-width="2"/><circle cx="334.0" cy="250.3" r="4.2" fill="#1baf7a" stroke="#fcfcfb" stroke-width="2"/><circle cx="444.4" cy="250.1" r="4.2" fill="#1baf7a" stroke="#fcfcfb" stroke-width="2"/><circle cx="554.8" cy="267.8" r="4.2" fill="#1baf7a" stroke="#fcfcfb" stroke-width="2"/><text x="113.2" y="196.0" text-anchor="middle" font-size="10.5" font-weight="400" font-family="ui-sans-serif,system-ui,sans-serif" fill="#0b0b0b" stroke="#fcfcfb" stroke-width="3.0" stroke-linejoin="round" paint-order="stroke">36%</text><text x="554.8" y="255.8" text-anchor="middle" font-size="10.5" font-weight="400" font-family="ui-sans-serif,system-ui,sans-serif" fill="#0b0b0b" stroke="#fcfcfb" stroke-width="3.0" stroke-linejoin="round" paint-order="stroke">12%</text><line x1="770.0" y1="235.5" x2="1322.0" y2="235.5" stroke="#e6e5e1" stroke-width="0.8"/><text x="762.0" y="239.1" text-anchor="end" font-size="10.5" fill="#52514e">0.5×</text><line x1="770.0" y1="173.0" x2="1322.0" y2="173.0" stroke="#e6e5e1" stroke-width="0.8"/><text x="762.0" y="176.6" text-anchor="end" font-size="10.5" fill="#52514e">1.0×</text><line x1="770.0" y1="110.5" x2="1322.0" y2="110.5" stroke="#e6e5e1" stroke-width="0.8"/><text x="762.0" y="114.1" text-anchor="end" font-size="10.5" fill="#52514e">1.5×</text><line x1="770.0" y1="48.0" x2="1322.0" y2="48.0" stroke="#e6e5e1" stroke-width="0.8"/><text x="762.0" y="51.6" text-anchor="end" font-size="10.5" fill="#52514e">2.0×</text><text x="825.2" y="316.0" text-anchor="middle" font-size="10.5" fill="#52514e">avant 1914</text><text x="935.6" y="316.0" text-anchor="middle" font-size="10.5" fill="#52514e">1914–1929</text><text x="1046.0" y="316.0" text-anchor="middle" font-size="10.5" fill="#52514e">1930–1944</text><text x="1156.4" y="316.0" text-anchor="middle" font-size="10.5" fill="#52514e">1945–1962</text><text x="1266.8" y="316.0" text-anchor="middle" font-size="10.5" fill="#52514e">après 1962</text><text x="770.0" y="26.0" text-anchor="start" font-size="12.5" fill="#52514e">Connectivité relative de Paris, qui ne baisse pas</text><line x1="805.2" y1="173.0" x2="1286.8" y2="173.0" stroke="#a9a8a2" stroke-width="1.4" stroke-dasharray="5 4"/><text x="1290.8" y="176.6" text-anchor="start" font-size="10" fill="#52514e">parité</text><path d="M825.2 141.1L935.6 133.7L1046.0 124.8L1156.4 153.0L1266.8 146.6" fill="none" stroke="#eb6834" stroke-width="2" stroke-linejoin="round"/><circle cx="825.2" cy="141.1" r="4.2" fill="#eb6834" stroke="#fcfcfb" stroke-width="2"/><circle cx="935.6" cy="133.7" r="4.2" fill="#eb6834" stroke="#fcfcfb" stroke-width="2"/><circle cx="1046.0" cy="124.8" r="4.2" fill="#eb6834" stroke="#fcfcfb" stroke-width="2"/><circle cx="1156.4" cy="153.0" r="4.2" fill="#eb6834" stroke="#fcfcfb" stroke-width="2"/><circle cx="1266.8" cy="146.6" r="4.2" fill="#eb6834" stroke="#fcfcfb" stroke-width="2"/><text x="825.2" y="129.1" text-anchor="middle" font-size="10.5" font-weight="400" font-family="ui-sans-serif,system-ui,sans-serif" fill="#0b0b0b" stroke="#fcfcfb" stroke-width="3.0" stroke-linejoin="round" paint-order="stroke">1.25×</text><text x="1266.8" y="134.6" text-anchor="middle" font-size="10.5" font-weight="400" font-family="ui-sans-serif,system-ui,sans-serif" fill="#0b0b0b" stroke="#fcfcfb" stroke-width="3.0" stroke-linejoin="round" paint-order="stroke">1.21×</text><g font-size="12.5" font-family="ui-sans-serif,system-ui,sans-serif" fill="#52514e"><circle cx="5.0" cy="355.8" r="5" fill="#2a78d6"/><text x="16.0" y="360.0">part des liens</text><circle cx="139.2" cy="355.8" r="5" fill="#1baf7a"/><text x="150.2" y="360.0">part des entreprises</text><circle cx="320.2" cy="355.8" r="5" fill="#eb6834"/><text x="331.2" y="360.0">degré relatif (échelle de droite)</text></g><g font-size="11.5" font-family="ui-sans-serif,system-ui,sans-serif" fill="#8a8983"><text x="0" y="391.5">À gauche, la part des liens traçables qui touchent Paris tombe de 63.5 % à 26.2 %, et la part des entreprises actives situées à Paris de 36.0 % à 12.1 % : les deux courbes descendent ensemble. À droite, le degré moyen</text><text x="0" y="406.5">d&#x27;une entreprise parisienne rapporté à celui des autres entreprises situées reste entre 1.16× et 1.39×, sans tendance. Une entreprise parisienne des années 1960 est aussi bien connectée, relativement, qu&#x27;une</text><text x="0" y="421.5">entreprise parisienne des années 1890. Paris n&#x27;a pas cessé d&#x27;être un moyeu ; le fonds a cessé d&#x27;être parisien.</text></g></svg>