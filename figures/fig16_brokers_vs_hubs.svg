S · degré #2754 → intermédiarité #382</title><text x="320.0" y="391.3" text-anchor="end" font-size="11.0" fill="#52514e">Agence centrale à PARIS</text><rect x="330.0" y="379.0" width="304.4" height="15.0" rx="4" fill="#2a78d6"/><text x="641.4" y="391.3" text-anchor="start" font-size="10.5" fill="#52514e">+2 372</text></g><g class="mk"><title>Tsanh Hap Tsao frères · degré #2662 → intermédiarité #335</title><text x="320.0" y="416.3" text-anchor="end" font-size="11.0" fill="#52514e">Tsanh Hap Tsao frères</text><rect x="330.0" y="404.0" width="298.6" height="15.0" rx="4" fill="#2a78d6"/><text x="635.6" y="416.3" text-anchor="start" font-size="10.5" fill="#52514e">+2 327</text></g><g class="mk"><title>Éts Julien Damoy · degré #2619 → intermédiarité #440</title><text x="320.0" y="441.3" text-anchor="end" font-size="11.0" fill="#52514e">Éts Julien Damoy</text><rect x="330.0" y="429.0" width="279.6" height="15.0" rx="4" fill="#2a78d6"/><text x="616.6" y="441.3" text-anchor="start" font-size="10.5" fill="#52514e">+2 179</text></g><g font-size="11.5" font-family="ui-sans-serif,system-ui,sans-serif" fill="#8a8983"><text x="0" y="473.5">Les 18 firmes dont le rang d&#x27;intermédiarité dépasse le plus nettement leur rang de degré, parmi les 600 premières en intermédiarité. La barre est l&#x27;écart entre les</text><text x="0" y="488.5">deux rangs. Société Immobilière d&#x27;Anfa gagne 4 956 rangs : peu de mandats partagés, mais placés entre des groupes qui ne se touchent pas autrement. Un courtier</text><text x="0" y="503.5">n&#x27;est pas un carrefour. « Agence centrale à PARIS » n&#x27;est pas une firme mais un libellé mal découpé : un nœud parasite occupe une position structurale réelle, ce qui</text><text x="0" y="518.5">est précisément la dette d&#x27;hygiène des noms de sociétés que signale le codebook.</text></g></svg>