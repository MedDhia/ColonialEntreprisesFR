<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1560 302" width="1560" height="302" role="img" aria-label="La géographie d&#x27;un lien"><title>La géographie d&#x27;un lien</title><rect width="1560" height="302" fill="#fcfcfb"/><text x="198.0" y="52.2" text-anchor="end" font-size="12.0" fill="#52514e">colonie – colonie</text><rect x="208.0" y="34.0" width="283.1" height="26" rx="0" fill="#eb6834"/><rect x="493.1" y="34.0" width="916.9" height="26" rx="4" fill="#2a78d6"/><text x="1419.0" y="52.2" text-anchor="start" font-size="11.5" fill="#52514e">20,546  (47.2%)</text><text x="198.0" y="98.2" text-anchor="end" font-size="12.0" fill="#52514e">métropole – colonie</text><rect x="208.0" y="80.0" width="0.0" height="26" rx="0" fill="#eb6834"/><rect x="208.0" y="80.0" width="923.9" height="26" rx="4" fill="#2a78d6"/><text x="1142.9" y="98.2" text-anchor="start" font-size="11.5" fill="#52514e">15,827  (36.3%)</text><text x="198.0" y="144.2" text-anchor="end" font-size="12.0" fill="#52514e">métropole – métropole</text><rect x="208.0" y="126.0" width="245.7" height="26" rx="0" fill="#eb6834"/><rect x="455.7" y="126.0" width="46.0" height="26" rx="4" fill="#2a78d6"/><text x="510.6" y="144.2" text-anchor="start" font-size="11.5" fill="#52514e">5,019  (11.5%)</text><text x="198.0" y="190.2" text-anchor="end" font-size="12.0" fill="#52514e">avec l&#x27;étranger</text><rect x="208.0" y="172.0" width="4.6" height="26" rx="0" fill="#eb6834"/><rect x="214.6" y="172.0" width="121.1" height="26" rx="4" fill="#2a78d6"/><text x="344.7" y="190.2" text-anchor="start" font-size="11.5" fill="#52514e">2,183  (5.0%)</text><g font-size="12.5" font-family="ui-sans-serif,system-ui,sans-serif" fill="#52514e"><circle cx="5.0" cy="243.8" r="5" fill="#eb6834"/><text x="16.0" y="248.0">dans un seul lieu</text><circle cx="159.2" cy="243.8" r="5" fill="#2a78d6"/><text x="170.2" y="248.0">entre deux lieux</text></g><g font-size="11.5" font-family="ui-sans-serif,system-ui,sans-serif" fill="#8a8983"><text x="0" y="279.5">Les 43,575 liens traçables classés par les deux extrémités. 9,117 d&#x27;entre eux (20.9 %) ne quittent pas un seul lieu ; le segment intérieur les montre. Le lien médian qui en sort couvre 3,083 km. Le rang colonie–colonie vient en tête, mais 10,384 de ses</text><text x="0" y="294.5">liens restent dans un même territoire et une partie des entreprises concernées est placée par classement, faute d&#x27;adresse : lire ce rang comme un maximum.</text></g></svg>