ize="11.0" fill="#8a8983">distance (liens d&#x27;interlock)</text><g font-size="11.5" font-family="ui-sans-serif,system-ui,sans-serif" fill="#8a8983"><text x="0" y="375.5">Distribution des plus courts chemins dans la composante géante, à partir de 200 firmes tirées au sort (graine fixe). Distance moyenne 3,35, maximum observé 9 :</text><text x="0" y="390.5">n&#x27;importe quelles deux des 5 921 firmes de la composante sont à trois poignées de main l&#x27;une de l&#x27;autre. À lire avec la figure 21 — cette petitesse est celle du graphe à</text><text x="0" y="405.5">un seul administrateur partagé.</text></g></svg>