3.0" y="341.0" text-anchor="middle" font-size="11.0" fill="#8a8983">1930–1944</text><g class="mk"><title>1945–1962: 10 611 / 18 581</title><rect x="705.0" y="157.0" width="64.0" height="169.0" rx="4.0" fill="#2a78d6"/></g><text x="737.0" y="152.0" text-anchor="middle" font-size="10.5" fill="#52514e">57,1%</text><text x="737.0" y="341.0" text-anchor="middle" font-size="11.0" fill="#8a8983">1945–1962</text><g class="mk"><title>post-1962: 347 / 748</title><rect x="899.0" y="188.7" width="64.0" height="137.3" rx="4.0" fill="#2a78d6"/></g><text x="931.0" y="183.7" text-anchor="middle" font-size="10.5" fill="#52514e">46,4%</text><text x="931.0" y="341.0" text-anchor="middle" font-size="11.0" fill="#8a8983">post-1962</text><line x1="58.0" y1="326.0" x2="1028.0" y2="326.0" stroke="#e6e5e1" stroke-width="1"/><text x="0.0" y="11.0" text-anchor="start" font-size="11.0" fill="#8a8983">part des interlocks franchissant une frontière</text><g font-size="11.5" font-family="ui-sans-serif,system-ui,sans-serif" fill="#8a8983"><text x="0" y="375.5">Part des liens d&#x27;interlock unissant deux firmes rattachées à des territoires différents. Sur l&#x27;ensemble du graphe, 67,4 %. La part décroît régulièrement d&#x27;une période à</text><text x="0" y="390.5">la suivante, mais la composition des sources change en même temps (figure 9) : la tendance est réelle dans les données, elle n&#x27;est pas pour autant établie comme une</text><text x="0" y="405.5">tendance historique.</text></g></svg>