"#52514e">27,9%</text><text x="361.1" y="361.0" text-anchor="middle" font-size="11.0" fill="#8a8983">3</text><g class="mk"><title>w ≥ 4: 959 firmes (16,1 %), 2 587 liens</title><rect x="450.4" y="295.1" width="64.0" height="50.9" rx="4.0" fill="#2a78d6"/></g><text x="482.4" y="290.1" text-anchor="middle" font-size="10.5" fill="#52514e">16,1%</text><text x="482.4" y="361.0" text-anchor="middle" font-size="11.0" fill="#8a8983">4</text><g class="mk"><title>w ≥ 5: 477 firmes (8,0 %), 1 481 liens</title><rect x="571.6" y="320.7" width="64.0" height="25.3" rx="4.0" fill="#2a78d6"/></g><text x="603.6" y="315.7" text-anchor="middle" font-size="10.5" fill="#52514e">8%</text><text x="603.6" y="361.0" text-anchor="middle" font-size="11.0" fill="#8a8983">5</text><g class="mk"><title>w ≥ 6: 162 firmes (2,7 %), 882 liens</title><rect x="692.9" y="337.4" width="64.0" height="8.6" rx="4.0" fill="#2a78d6"/></g><text x="724.9" y="332.4" text-anchor="middle" font-size="10.5" fill="#52514e">2,7%</text><text x="724.9" y="361.0" text-anchor="middle" font-size="11.0" fill="#8a8983">6</text><g class="mk"><title>w ≥ 7: 50 firmes (0,8 %), 574 liens</title><rect x="814.1" y="343.3" width="64.0" height="2.7" rx="4.0" fill="#2a78d6"/></g><text x="846.1" y="338.3" text-anchor="middle" font-size="10.5" fill="#52514e">0,8%</text><text x="846.1" y="361.0" text-anchor="middle" font-size="11.0" fill="#8a8983">7</text><g class="mk"><title>w ≥ 8: 18 firmes (0,3 %), 379 liens</title><rect x="935.4" y="345.0" width="64.0" height="1.0" rx="4.0" fill="#2a78d6"/></g><text x="967.4" y="340.0" text-anchor="middle" font-size="10.5" fill="#52514e">0,3%</text><text x="967.4" y="361.0" text-anchor="middle" font-size="11.0" fill="#8a8983">8</text><line x1="58.0" y1="346.0" x2="1028.0" y2="346.0" stroke="#e6e5e1" stroke-width="1"/><text x="0.0" y="11.0" text-anchor="start" font-size="11.0" fill="#8a8983">part des firmes dans la composante géante</text><text x="1028.0" y="376.0" text-anchor="end" font-size="11.0" fill="#8a8983">administrateurs partagés exigés</text><g font-size="11.5" font-family="ui-sans-serif,system-ui,sans-serif" fill="#8a8983"><text x="0" y="395.5">Composante géante en fonction du seuil de poids. À un administrateur partagé, 98,5 % des firmes forment une seule composante ; à deux, 48,6 %. Le réseau « connecté »</text><text x="0" y="410.5">de la figure 4 est donc tenu par des liens à un seul nom, dont chacun disparaît si la résolution d&#x27;entité se trompe une fois. Toute analyse de composante ou de distance</text><text x="0" y="425.5">doit indiquer son seuil.</text></g></svg>