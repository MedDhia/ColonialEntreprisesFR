<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 433" width="1040" height="433" role="img" aria-label="Ce qui reste quand on exige plus qu&#x27;un nom"><title>Ce qui reste quand on exige plus qu&#x27;un nom</title><rect width="1040" height="433" fill="#fcfcfb"/><line x1="58.0" y1="346.0" x2="1028.0" y2="346.0" stroke="#e6e5e1" stroke-width="1"/><text x="50.0" y="349.6" text-anchor="end" font-size="11.0" fill="#8a8983">0%</text><line x1="58.0" y1="267.0" x2="1028.0" y2="267.0" stroke="#e6e5e1" stroke-width="1"/><text x="50.0" y="270.6" text-anchor="end" font-size="11.0" fill="#8a8983">25%</text><line x1="58.0" y1="188.0" x2="1028.0" y2="188.0" stroke="#e6e5e1" stroke-width="1"/><text x="50.0" y="191.6" text-anchor="end" font-size="11.0" fill="#8a8983">50%</text><line x1="58.0" y1="109.0" x2="1028.0" y2="109.0" stroke="#e6e5e1" stroke-width="1"/><text x="50.0" y="112.6" text-anchor="end" font-size="11.0" fill="#8a8983">75%</text><line x1="58.0" y1="30.0" x2="1028.0" y2="30.0" stroke="#e6e5e1" stroke-width="1"/><text x="50.0" y="33.6" text-anchor="end" font-size="11.0" fill="#8a8983">100%</text><g class="mk"><title>w ≥ 1: 5 904 firmes (98,6 %), 79 072 liens</title><rect x="86.6" y="34.5" width="64.0" height="311.5" rx="4.0" fill="#2a78d6"/></g><text x="118.6" y="29.5" text-anchor="middle" font-size="10.5" fill="#52514e">98,6%</text><text x="118.6" y="361.0" text-anchor="middle" font-size="11.0" fill="#8a8983">1</text><g class="mk"><title>w ≥ 2: 2 922 firmes (48,8 %), 12 827 liens</title><rect x="207.9" y="191.8" width="64.0" height="154.2" rx="4.0" fill="#2a78d6"/></g><text x="239.9" y="186.8" text-anchor="middle" font-size="10.5" fill="#52514e">48,8%</text><text x="239.9" y="361.0" text-anchor="middle" font-size="11.0" fill="#8a8983">2</text><g class="mk"><title>w ≥ 3: 1 665 firmes (27,8 %), 5 109 liens</title><rect x="329.1" y="258.1" width="64.0" height="87.9" rx="4.0" fill="#2a78d6"/></g><text x="361.1" y="253.1" text-anchor="middle" font-size="10.5" fill="#52514e">27,8%</text><text x="361.1" y="361.0" text-anchor="middle" font-size="11.0" fill="#8a8983">3</text><g class="mk"><title>w ≥ 4: 959 firmes (16,0 %), 2 595 liens</title><rect x="450.4" y="295.4" width="64.0" height="50.6" rx="4.0" fill="#2a78d6"/></g><text x="482.4" y="290.4" text-anchor="middle" font-size="10.5" fill="#52514e">16%</text><text x="482.4" y="361.0" text-anchor="middle" font-size="11.0" fill="#8a8983">4</text><g class="mk"><title>w ≥ 5: 477 firmes (8,0 %), 1 483 liens</title><rect x="571.6" y="320.8" width="64.0" height="25.2" rx="4.0" fill="#2a78d6"/></g><text x="603.6" y="315.8" text-anchor="middle" font-size="10.5" fill="#52514e">8%</text><text x="603.6" y="361.0" text-anchor="middle" font-size="11.0" fill="#8a8983">5</text><g class="mk"><title>w ≥ 6: 162 firmes (2,7 %), 883 liens</title><rect x="692.9" y="337.5" width="64.0" height="8.5" rx="4.0" fill="#2a78d6"/></g><text x="724.9" y="332.5" text-anchor="middle" font-size="10.5" fill="#52514e">2,7%</text><text x="724.9" y="361.0" text-anchor="middle" font-size="11.0" fill="#8a8983">6</text><g class="mk"><title>w ≥ 7: 50 firmes (0,8 %), 576 liens</title><rect x="814.1" y="343.4" width="64.0" height="2.6" rx="4.0" fill="#2a78d6"/></g><text x="846.1" y="338.4" text-anchor="middle" font-size="10.5" fill="#52514e">0,8%</text><text x="846.1" y="361.0" text-anchor="middle" font-size="11.0" fill="#8a8983">7</text><g class="mk"><title>w ≥ 8: 18 firmes (0,3 %), 379 liens</title><rect x="935.4" y="345.1" width="64.0" height="1.0" rx="4.0" fill="#2a78d6"/></g><text x="967.4" y="340.1" text-anchor="middle" font-size="10.5" fill="#52514e">0,3%</text><text x="967.4" y="361.0" text-anchor="middle" font-size="11.0" fill="#8a8983">8</text><line x1="58.0" y1="346.0" x2="1028.0" y2="346.0" stroke="#e6e5e1" stroke-width="1"/><text x="0.0" y="11.0" text-anchor="start" font-size="11.0" fill="#8a8983">part des firmes dans la composante géante</text><text x="1028.0" y="376.0" text-anchor="end" font-size="11.0" fill="#8a8983">administrateurs partagés exigés</text><g font-size="11.5" font-family="ui-sans-serif,system-ui,sans-serif" fill="#8a8983"><text x="0" y="395.5">Composante géante en fonction du seuil de poids. À un administrateur partagé, 98,6 % des firmes forment une seule composante ; à deux, 48,8 %. Le réseau « connecté »</text><text x="0" y="410.5">de la figure 4 est donc tenu par des liens à un seul nom, dont chacun disparaît si la résolution d&#x27;entité se trompe une fois. Toute analyse de composante ou de distance</text><text x="0" y="425.5">doit indiquer son seuil.</text></g></svg>