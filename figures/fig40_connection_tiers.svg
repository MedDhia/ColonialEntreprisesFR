<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1340 338" width="1340" height="338" role="img" aria-label="fig. 40 — La connexion politique, par degré"><title>fig. 40 — La connexion politique, par degré</title><rect width="1340" height="338" fill="#fcfcfb"/><text x="46.0" y="12.0" text-anchor="start" font-size="10.5" fill="#8a8983">Non représenté : 4,224 sociétés (65%) sans connexion attestée, dont 3,270 partagent un administrateur avec une société connectée.</text><g class="mk"><title>Exécutif: 889 / 6,471 (13.7%)</title><rect x="141.2" y="26.0" width="127.0" height="240.0" rx="4" fill="#2a78d6"/></g><text x="204.8" y="20.0" text-anchor="middle" font-size="10.5" fill="#52514e">889</text><text x="204.8" y="281.0" text-anchor="middle" font-size="10.5" fill="#52514e">Exécutif</text><g class="mk"><title>Législatif: 711 / 6,471 (11.0%)</title><rect x="458.8" y="74.1" width="127.0" height="191.9" rx="4" fill="#2a78d6"/></g><text x="522.2" y="68.1" text-anchor="middle" font-size="10.5" fill="#52514e">711</text><text x="522.2" y="281.0" text-anchor="middle" font-size="10.5" fill="#52514e">Législatif</text><g class="mk"><title>Administration: 500 / 6,471 (7.7%)</title><rect x="776.2" y="131.0" width="127.0" height="135.0" rx="4" fill="#1baf7a"/></g><text x="839.8" y="125.0" text-anchor="middle" font-size="10.5" fill="#52514e">500</text><text x="839.8" y="281.0" text-anchor="middle" font-size="10.5" fill="#52514e">Administration</text><g class="mk"><title>Local ou par un proche: 147 / 6,471 (2.3%)</title><rect x="1093.8" y="226.3" width="127.0" height="39.7" rx="4" fill="#1baf7a"/></g><text x="1157.2" y="220.3" text-anchor="middle" font-size="10.5" fill="#52514e">147</text><text x="1157.2" y="281.0" text-anchor="middle" font-size="10.5" fill="#52514e">Local ou par un proche</text><line x1="46.0" y1="266.0" x2="1316.0" y2="266.0" stroke="#e6e5e1" stroke-width="1"/><g font-size="11.5" font-family="ui-sans-serif,system-ui,sans-serif" fill="#8a8983"><text x="0" y="315.5">Les 6,471 sociétés ayant au moins un siège de conseil observé. 2,247 (35%) ont au moins un administrateur attesté dans une fonction publique. Sur les 4,224 sans connexion propre, 3,270 partagent un administrateur</text><text x="0" y="330.5">avec une société connectée : la connexion indirecte n&#x27;est pas comptée dans le degré, et c&#x27;est délibéré — être à un lien du conseil d&#x27;un ministre n&#x27;est pas la même chose que d&#x27;avoir ce ministre au sien.</text></g></svg>