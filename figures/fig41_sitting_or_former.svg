<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1340 376" width="1340" height="376" role="img" aria-label="fig. 41 — En fonction, ou ancien"><title>fig. 41 — En fonction, ou ancien</title><rect width="1340" height="376" fill="#fcfcfb"/><g class="mk"><title>Exécutif — en fonction: 859</title><rect x="115.8" y="26.0" width="69.8" height="240.0" rx="4" fill="#2a78d6"/></g><text x="150.8" y="20.0" text-anchor="middle" font-size="10.5" fill="#52514e">859</text><g class="mk"><title>Exécutif — ancien: 473</title><rect x="198.4" y="133.8" width="69.8" height="132.2" rx="4" fill="#eb6834"/></g><text x="233.3" y="127.8" text-anchor="middle" font-size="10.5" fill="#52514e">473</text><text x="204.8" y="281.0" text-anchor="middle" font-size="10.5" fill="#52514e">Exécutif</text><g class="mk"><title>Législatif — en fonction: 713</title><rect x="433.4" y="66.8" width="69.8" height="199.2" rx="4" fill="#2a78d6"/></g><text x="468.3" y="60.8" text-anchor="middle" font-size="10.5" fill="#52514e">713</text><g class="mk"><title>Législatif — ancien: 35</title><rect x="515.9" y="256.2" width="69.8" height="9.8" rx="4" fill="#eb6834"/></g><text x="550.8" y="250.2" text-anchor="middle" font-size="10.5" fill="#52514e">35</text><text x="522.2" y="281.0" text-anchor="middle" font-size="10.5" fill="#52514e">Législatif</text><g class="mk"><title>Administration — en fonction: 452</title><rect x="750.9" y="139.7" width="69.8" height="126.3" rx="4" fill="#2a78d6"/></g><text x="785.8" y="133.7" text-anchor="middle" font-size="10.5" fill="#52514e">452</text><g class="mk"><title>Administration — ancien: 115</title><rect x="833.4" y="233.9" width="69.8" height="32.1" rx="4" fill="#eb6834"/></g><text x="868.3" y="227.9" text-anchor="middle" font-size="10.5" fill="#52514e">115</text><text x="839.8" y="281.0" text-anchor="middle" font-size="10.5" fill="#52514e">Administration</text><g class="mk"><title>Local ou par un proche — en fonction: 132</title><rect x="1068.3" y="229.1" width="69.8" height="36.9" rx="4" fill="#2a78d6"/></g><text x="1103.3" y="223.1" text-anchor="middle" font-size="10.5" fill="#52514e">132</text><g class="mk"><title>Local ou par un proche — ancien: 18</title><rect x="1150.9" y="261.0" width="69.8" height="5.0" rx="4" fill="#eb6834"/></g><text x="1185.8" y="255.0" text-anchor="middle" font-size="10.5" fill="#52514e">18</text><text x="1157.2" y="281.0" text-anchor="middle" font-size="10.5" fill="#52514e">Local ou par un proche</text><line x1="46.0" y1="266.0" x2="1316.0" y2="266.0" stroke="#e6e5e1" stroke-width="1"/><g font-size="12.5" font-family="ui-sans-serif,system-ui,sans-serif" fill="#52514e"><circle cx="5.0" cy="317.8" r="5" fill="#2a78d6"/><text x="16.0" y="322.0">en fonction</text><circle cx="119.2" cy="317.8" r="5" fill="#eb6834"/><text x="130.2" y="322.0">ancien</text></g><g font-size="11.5" font-family="ui-sans-serif,system-ui,sans-serif" fill="#8a8983"><text x="0" y="353.5">Un administrateur en fonction est un conflit d&#x27;intérêts ; un ancien gouverneur général est une porte tournante. Les deux ne sont jamais additionnés et une société peut compter dans les deux. « Ancien » est lu dans les</text><text x="0" y="368.5">mots de la source — « ancien », « honoraire », « en retraite » — que le compilateur omet bien plus souvent qu&#x27;il n&#x27;omet la fonction elle-même : lire les barres oranges comme un plancher et les bleues comme un plafond.</text></g></svg>