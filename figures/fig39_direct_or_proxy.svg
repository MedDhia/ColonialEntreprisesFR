<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1340 376" width="1340" height="376" role="img" aria-label="fig. 39 — En propre, ou par un proche"><title>fig. 39 — En propre, ou par un proche</title><rect width="1340" height="376" fill="#fcfcfb"/><g class="mk"><title>1924 — en propre: 87</title><rect x="133.1" y="129.7" width="100.2" height="136.3" rx="4" fill="#2a78d6"/></g><g class="mk"><title>1924 — par un proche: 10</title><rect x="133.1" y="116.0" width="100.2" height="13.7" rx="4" fill="#eb6834"/></g><text x="183.2" y="281.0" text-anchor="middle" font-size="10.5" fill="#52514e">1924</text><text x="183.2" y="108.0" text-anchor="middle" font-size="10.5" fill="#52514e">97</text><g class="mk"><title>1930 — en propre: 149</title><rect x="383.5" y="32.5" width="100.2" height="233.5" rx="4" fill="#2a78d6"/></g><g class="mk"><title>1930 — par un proche: 8</title><rect x="383.5" y="22.0" width="100.2" height="10.5" rx="4" fill="#eb6834"/></g><text x="433.6" y="281.0" text-anchor="middle" font-size="10.5" fill="#52514e">1930</text><text x="433.6" y="14.0" text-anchor="middle" font-size="10.5" fill="#52514e">157</text><g class="mk"><title>1932 — en propre: 143</title><rect x="633.9" y="41.9" width="100.2" height="224.1" rx="4" fill="#2a78d6"/></g><g class="mk"><title>1932 — par un proche: 7</title><rect x="633.9" y="33.0" width="100.2" height="9.0" rx="4" fill="#eb6834"/></g><text x="684.0" y="281.0" text-anchor="middle" font-size="10.5" fill="#52514e">1932</text><text x="684.0" y="25.0" text-anchor="middle" font-size="10.5" fill="#52514e">150</text><g class="mk"><title>1936 — en propre: 133</title><rect x="884.3" y="57.6" width="100.2" height="208.4" rx="4" fill="#2a78d6"/></g><g class="mk"><title>1936 — par un proche: 5</title><rect x="884.3" y="51.8" width="100.2" height="5.8" rx="4" fill="#eb6834"/></g><text x="934.4" y="281.0" text-anchor="middle" font-size="10.5" fill="#52514e">1936</text><text x="934.4" y="43.8" text-anchor="middle" font-size="10.5" fill="#52514e">138</text><g class="mk"><title>1954 — en propre: 39</title><rect x="1134.7" y="204.9" width="100.2" height="61.1" rx="4" fill="#2a78d6"/></g><text x="1184.8" y="281.0" text-anchor="middle" font-size="10.5" fill="#52514e">1954</text><text x="1184.8" y="198.9" text-anchor="middle" font-size="10.5" fill="#52514e">39</text><line x1="58.0" y1="266.0" x2="1310.0" y2="266.0" stroke="#e6e5e1" stroke-width="1"/><g font-size="12.5" font-family="ui-sans-serif,system-ui,sans-serif" fill="#52514e"><circle cx="5.0" cy="317.8" r="5" fill="#2a78d6"/><text x="16.0" y="322.0">en propre</text><circle cx="113.9" cy="317.8" r="5" fill="#eb6834"/><text x="124.9" y="322.0">par un proche</text></g><g font-size="11.5" font-family="ui-sans-serif,system-ui,sans-serif" fill="#8a8983"><text x="0" y="353.5">Le titre du groupe de documents dit « intéressés directement ou par des proches » : le compilateur suit les deux. Les liens attribués à un parent sont rattachés à ce parent, jamais au parlementaire, et sont exclus du</text><text x="0" y="368.5">réseau principal. Ils sont peu nombreux, mais leur existence est le fait à retenir : la source distingue le prête-nom, donc le jeu de données aussi.</text></g></svg>