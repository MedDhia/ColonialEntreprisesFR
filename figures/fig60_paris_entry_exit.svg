y="332.0" text-anchor="middle" font-size="10.5" fill="#52514e">1914–1929</text><text x="977.0" y="332.0" text-anchor="middle" font-size="10.5" fill="#52514e">1930–1944</text><text x="1115.0" y="332.0" text-anchor="middle" font-size="10.5" fill="#52514e">1945–1962</text><text x="1253.0" y="332.0" text-anchor="middle" font-size="10.5" fill="#52514e">après 1962</text><text x="770.0" y="26.0" text-anchor="start" font-size="12.5" fill="#52514e">Part des entrants fondés dans la période</text><rect x="804.0" y="95.1" width="22.0" height="202.9" rx="3" fill="#1baf7a"/><text x="815.0" y="316.0" text-anchor="middle" font-size="8.5" fill="#52514e">tout</text><text x="815.0" y="89.1" text-anchor="middle" font-size="10.5" font-weight="400" font-family="ui-sans-serif,system-ui,sans-serif" fill="#0b0b0b" stroke="#fcfcfb" stroke-width="3.0" stroke-linejoin="round" paint-order="stroke">81%</text><rect x="828.0" y="92.6" width="22.0" height="205.4" rx="3" fill="#1baf7a"/><text x="839.0" y="316.0" text-anchor="middle" font-size="8.5" fill="#52514e">métr.</text><rect x="852.0" y="92.0" width="22.0" height="206.0" rx="3" fill="#1baf7a"/><text x="863.0" y="316.0" text-anchor="middle" font-size="8.5" fill="#52514e">emp.</text><rect x="942.0" y="205.3" width="22.0" height="92.7" rx="3" fill="#1baf7a"/><text x="953.0" y="316.0" text-anchor="middle" font-size="8.5" fill="#52514e">tout</text><text x="953.0" y="199.3" text-anchor="middle" font-size="10.5" font-weight="400" font-family="ui-sans-serif,system-ui,sans-serif" fill="#0b0b0b" stroke="#fcfcfb" stroke-width="3.0" stroke-linejoin="round" paint-order="stroke">37%</text><rect x="966.0" y="218.2" width="22.0" height="79.8" rx="3" fill="#1baf7a"/><text x="977.0" y="316.0" text-anchor="middle" font-size="8.5" fill="#52514e">métr.</text><rect x="990.0" y="202.4" width="22.0" height="95.6" rx="3" fill="#1baf7a"/><text x="1001.0" y="316.0" text-anchor="middle" font-size="8.5" fill="#52514e">emp.</text><rect x="1080.0" y="250.6" width="22.0" height="47.4" rx="3" fill="#1baf7a"/><text x="1091.0" y="316.0" text-anchor="middle" font-size="8.5" fill="#52514e">tout</text><text x="1091.0" y="244.6" text-anchor="middle" font-size="10.5" font-weight="400" font-family="ui-sans-serif,system-ui,sans-serif" fill="#0b0b0b" stroke="#fcfcfb" stroke-width="3.0" stroke-linejoin="round" paint-order="stroke">19%</text><rect x="1104.0" y="280.1" width="22.0" height="17.9" rx="3" fill="#1baf7a"/><text x="1115.0" y="316.0" text-anchor="middle" font-size="8.5" fill="#52514e">métr.</text><rect x="1128.0" y="243.8" width="22.0" height="54.2" rx="3" fill="#1baf7a"/><text x="1139.0" y="316.0" text-anchor="middle" font-size="8.5" fill="#52514e">emp.</text><rect x="1218.0" y="294.0" width="22.0" height="4.0" rx="3" fill="#1baf7a"/><text x="1229.0" y="316.0" text-anchor="middle" font-size="8.5" fill="#52514e">tout</text><text x="1229.0" y="288.0" text-anchor="middle" font-size="10.5" font-weight="400" font-family="ui-sans-serif,system-ui,sans-serif" fill="#0b0b0b" stroke="#fcfcfb" stroke-width="3.0" stroke-linejoin="round" paint-order="stroke">2%</text><rect x="1242.0" y="298.0" width="22.0" height="0.0" rx="3" fill="#1baf7a"/><text x="1253.0" y="316.0" text-anchor="middle" font-size="8.5" fill="#52514e">métr.</text><rect x="1266.0" y="293.1" width="22.0" height="4.9" rx="3" fill="#1baf7a"/><text x="1277.0" y="316.0" text-anchor="middle" font-size="8.5" fill="#52514e">emp.</text><g font-size="12.5" font-family="ui-sans-serif,system-ui,sans-serif" fill="#52514e"><circle cx="5.0" cy="371.8" r="5" fill="#a9a8a2"/><text x="16.0" y="376.0">stock en place</text><circle cx="142.6" cy="371.8" r="5" fill="#eb6834"/><text x="153.6" y="376.0">sorties</text><circle cx="232.4" cy="371.8" r="5" fill="#2a78d6"/><text x="243.4" y="376.0">entrées</text><circle cx="325.7" cy="371.8" r="5" fill="#1baf7a"/><text x="336.7" y="376.0">fondés dans la période (panneau droit)</text></g><g font-size="11.5" font-family="ui-sans-serif,system-ui,sans-serif" fill="#8a8983"><text x="0" y="407.5">À gauche : à chaque transition, les entreprises qui arrivent sont bien moins parisiennes que le stock qu&#x27;elles rejoignent (22.5 % contre 36.0 % d&#x27;abord, 7.8 % contre 19.2 % à la fin), tandis que celles qui sortent</text><text x="0" y="422.5">ressemblent au stock. Rien ne chasse Paris ; quelque chose de non parisien arrive. Une entreprise n&#x27;a qu&#x27;un seul point d&#x27;ancrage pour toute la période couverte, donc la composition ne peut changer que par entrée</text><text x="0" y="437.5">et sortie : c&#x27;est une contrainte du jeu de données, pas un résultat. À droite : la part des entrants réellement fondés dans la période où ils apparaissent s&#x27;effondre de 81 % à 2 %. Au début ce sont de vraies créations ;</text><text x="0" y="452.5">à la fin ce sont de vieilles entreprises dont le compilateur parle enfin. Les trois barres montrent que la chute tient dans chaque strate, donc qu&#x27;elle n&#x27;est pas un artefact du champ « année de fondation », mieux rempli</text><text x="0" y="467.5">en métropole.</text></g></svg>