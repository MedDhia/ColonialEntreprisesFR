 text-anchor="middle" font-size="9.5" fill="#52514e">94%</text><text x="31.6" y="281.0" text-anchor="middle" font-size="9.5" fill="#8a8983">pre-1914</text><g class="mk"><title>1914–1929: 95%</title><rect x="66.1" y="37.3" width="57.1" height="228.7" rx="4" fill="#2a78d6"/></g><text x="94.6" y="32.3" text-anchor="middle" font-size="9.5" fill="#52514e">95%</text><text x="94.6" y="281.0" text-anchor="middle" font-size="9.5" fill="#8a8983">1914–1929</text><g class="mk"><title>1930–1944: 95%</title><rect x="129.2" y="37.6" width="57.1" height="228.4" rx="4" fill="#2a78d6"/></g><text x="157.8" y="32.6" text-anchor="middle" font-size="9.5" fill="#52514e">95%</text><text x="157.8" y="281.0" text-anchor="middle" font-size="9.5" fill="#8a8983">1930–1944</text><g class="mk"><title>1945–1962: 97%</title><rect x="192.3" y="34.0" width="57.1" height="232.0" rx="4" fill="#2a78d6"/></g><text x="220.9" y="29.0" text-anchor="middle" font-size="9.5" fill="#52514e">97%</text><text x="220.9" y="281.0" text-anchor="middle" font-size="9.5" fill="#8a8983">1945–1962</text><g class="mk"><title>post-1962: 83%</title><rect x="255.4" y="67.0" width="57.1" height="199.0" rx="4" fill="#2a78d6"/></g><text x="283.9" y="62.0" text-anchor="middle" font-size="9.5" fill="#52514e">83%</text><text x="283.9" y="281.0" text-anchor="middle" font-size="9.5" fill="#8a8983">post-1962</text></g><g font-size="11.5" font-family="ui-sans-serif,system-ui,sans-serif" fill="#8a8983"><text x="0" y="315.5">Quatre mesures de structure, une par panneau, chacune sur sa propre échelle : les unités diffèrent, et un axe partagé — ou pire, deux axes verticaux sur un même graphique — rendrait la comparaison fausse. Chaque</text><text x="0" y="330.5">tranche est reconstruite à partir des seuls liens datés de la période, si bien qu&#x27;une firme non datée n&#x27;apparaît dans aucune. Comparer deux périodes compare aussi deux volumes de dépouillement (figures 8 et 9).</text></g></svg>