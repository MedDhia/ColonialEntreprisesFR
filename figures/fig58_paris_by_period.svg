4.0" y2="171.0" stroke="#e6e5e1" stroke-width="0.8"/><text x="864.0" y="174.6" text-anchor="end" font-size="10.5" fill="#52514e">50%</text><line x1="872.0" y1="108.5" x2="1544.0" y2="108.5" stroke="#e6e5e1" stroke-width="0.8"/><text x="864.0" y="112.1" text-anchor="end" font-size="10.5" fill="#52514e">75%</text><line x1="872.0" y1="46.0" x2="1544.0" y2="46.0" stroke="#e6e5e1" stroke-width="0.8"/><text x="864.0" y="49.6" text-anchor="end" font-size="10.5" fill="#52514e">100%</text><text x="939.2" y="314.0" text-anchor="middle" font-size="10.5" fill="#52514e">avant 1914</text><text x="1073.6" y="314.0" text-anchor="middle" font-size="10.5" fill="#52514e">1914–1929</text><text x="1208.0" y="314.0" text-anchor="middle" font-size="10.5" fill="#52514e">1930–1944</text><text x="1342.4" y="314.0" text-anchor="middle" font-size="10.5" fill="#52514e">1945–1962</text><text x="1476.8" y="314.0" text-anchor="middle" font-size="10.5" fill="#52514e">après 1962</text><path d="M121.2 137.3L255.6 167.3L390.0 194.2L524.4 203.8L658.8 230.4" fill="none" stroke="#2a78d6" stroke-width="2" stroke-linejoin="round"/><circle cx="121.2" cy="137.3" r="4.2" fill="#2a78d6" stroke="#fcfcfb" stroke-width="2"/><circle cx="255.6" cy="167.3" r="4.2" fill="#2a78d6" stroke="#fcfcfb" stroke-width="2"/><circle cx="390.0" cy="194.2" r="4.2" fill="#2a78d6" stroke="#fcfcfb" stroke-width="2"/><circle cx="524.4" cy="203.8" r="4.2" fill="#2a78d6" stroke="#fcfcfb" stroke-width="2"/><circle cx="658.8" cy="230.4" r="4.2" fill="#2a78d6" stroke="#fcfcfb" stroke-width="2"/><text x="121.2" y="125.3" text-anchor="middle" font-size="10.5" font-weight="400" font-family="ui-sans-serif,system-ui,sans-serif" fill="#0b0b0b" stroke="#fcfcfb" stroke-width="3.0" stroke-linejoin="round" paint-order="stroke">63%</text><text x="658.8" y="218.4" text-anchor="middle" font-size="10.5" font-weight="400" font-family="ui-sans-serif,system-ui,sans-serif" fill="#0b0b0b" stroke="#fcfcfb" stroke-width="3.0" stroke-linejoin="round" paint-order="stroke">26%</text><path d="M121.2 89.5L255.6 131.2L390.0 140.0L524.4 145.5L658.8 190.7" fill="none" stroke="#1baf7a" stroke-width="2" stroke-linejoin="round"/><circle cx="121.2" cy="89.5" r="4.2" fill="#1baf7a" stroke="#fcfcfb" stroke-width="2"/><circle cx="255.6" cy="131.2" r="4.2" fill="#1baf7a" stroke="#fcfcfb" stroke-width="2"/><circle cx="390.0" cy="140.0" r="4.2" fill="#1baf7a" stroke="#fcfcfb" stroke-width="2"/><circle cx="524.4" cy="145.5" r="4.2" fill="#1baf7a" stroke="#fcfcfb" stroke-width="2"/><circle cx="658.8" cy="190.7" r="4.2" fill="#1baf7a" stroke="#fcfcfb" stroke-width="2"/><text x="121.2" y="77.5" text-anchor="middle" font-size="10.5" font-weight="400" font-family="ui-sans-serif,system-ui,sans-serif" fill="#0b0b0b" stroke="#fcfcfb" stroke-width="3.0" stroke-linejoin="round" paint-order="stroke">83%</text><text x="658.8" y="178.7" text-anchor="middle" font-size="10.5" font-weight="400" font-family="ui-sans-serif,system-ui,sans-serif" fill="#0b0b0b" stroke="#fcfcfb" stroke-width="3.0" stroke-linejoin="round" paint-order="stroke">42%</text><rect x="910.2" y="81.0" width="58.0" height="215.0" rx="4" fill="#a9a8a2"/><text x="939.2" y="75.0" text-anchor="middle" font-size="10.5" fill="#52514e">86%</text><rect x="1044.6" y="80.1" width="58.0" height="215.9" rx="4" fill="#a9a8a2"/><text x="1073.6" y="74.1" text-anchor="middle" font-size="10.5" fill="#52514e">86%</text><rect x="1179.0" y="85.4" width="58.0" height="210.6" rx="4" fill="#a9a8a2"/><text x="1208.0" y="79.4" text-anchor="middle" font-size="10.5" fill="#52514e">84%</text><rect x="1313.4" y="205.4" width="58.0" height="90.6" rx="4" fill="#eb6834"/><text x="1342.4" y="199.4" text-anchor="middle" font-size="10.5" fill="#52514e">36%</text><rect x="1447.8" y="92.7" width="58.0" height="203.3" rx="4" fill="#a9a8a2"/><text x="1476.8" y="86.7" text-anchor="middle" font-size="10.5" fill="#52514e">81%</text><text x="54.0" y="24.0" text-anchor="start" font-size="12.5" fill="#52514e">Part des liens traçables qui touchent Paris</text><text x="872.0" y="24.0" text-anchor="start" font-size="12.5" fill="#52514e">Part des entreprises de la période que l&#x27;on peut situer</text><g font-size="12.5" font-family="ui-sans-serif,system-ui,sans-serif" fill="#52514e"><circle cx="5.0" cy="353.8" r="5" fill="#2a78d6"/><text x="16.0" y="358.0">toutes entreprises situées</text><circle cx="222.6" cy="353.8" r="5" fill="#1baf7a"/><text x="233.6" y="358.0">adresse seule</text><circle cx="359.3" cy="353.8" r="5" fill="#eb6834"/><text x="370.3" y="358.0">couverture sous 50 %</text></g><g font-size="11.5" font-family="ui-sans-serif,system-ui,sans-serif" fill="#8a8983"><text x="0" y="389.5">À gauche, la part parisienne tombe à chaque période, de 63.5 % à 26.2 %. Le second tracé refait le calcul sur les seules entreprises ayant une adresse de rue — là où la position est un fait sur l&#x27;entreprise et non sur le classement du catalogue — et la</text><text x="0" y="404.5">tendance tient : 82.6 % à 42.1 %. À droite, la raison de se méfier tout de même : la couverture s&#x27;effondre en 1945–1962, où 1,484 des entreprises actives sont classées sous la rubrique transversale *Empire* sans aucun pays. Ce panneau est un</text><text x="0" y="419.5">échantillon plus mince, pas un réseau plus mince.</text></g></svg>