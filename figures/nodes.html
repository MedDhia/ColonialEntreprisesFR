</style><h1>Le réseau, nœud par nœud</h1><p class="lede">Les autres pages montrent la forme de l&#x27;ensemble. Celle-ci montre des graphes assez petits pour qu&#x27;on puisse nommer chaque firme, suivre chaque lien, et voir de quoi le réseau est fait.</p><button onclick="document.documentElement.dataset.theme=document.documentElement.dataset.theme==='dark'?'light':'dark'">Basculer le thème</button><figure id="fig28_backbone"><h2 style="font-size:16px;margin:0 0 2px">L&#x27;ossature du réseau, firme par firme</h2><figcaption>Les 54 firmes les plus liées du graphe à trois administrateurs partagés ou plus — le seuil au-delà duquel le réseau ne tient plus par des liens à un seul nom (figure 21). L&#x27;aire d&#x27;un nœud est son degré pondéré et sa couleur son territoire ; un lien unissant deux territoires différents est tracé plus sombre et plus épais — 124 des 179 liens dessinés. La distinction est un pas de gris et non une teinte : les teintes sont déjà prises par les territoires, et la même couleur ne peut pas dire deux choses dans une figure. Les noms qui ne tenaient pas sont dans le tableau.</figcaption><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1340 738" width="1340" height="738" role="img" aria-label="L&#x27;ossature du réseau, firme par firme"><title>L&#x27;ossature du réseau, firme par firme</title><rect width="1340" height="738" fill="var(--surface)"/><g fill="none" stroke-linecap="round"><path d="M511.0 158.3Q502.8 140.1 505.2 120.3M796.8 136.2Q854.5 103.7 886.9 46.0M557.0 202.3Q601.0 227.3 651.6 225.8M645.0 322.7Q661.9 275.2 651.6 225.8M582.8 159.8Q607.9 202.5 651.6 225.8M518.3 363.4Q493.1 347.8 479.7 321.3M629.3 262.0Q567.5 258.2 516.7 222.9M629.3 262.0Q602.8 281.8 569.8 285.0M651.6 225.8Q688.8 189.9 702.0 139.9M575.1 179.9Q551.9 209.6 516.7 222.9M732.2 427.9Q716.3 462.2 684.9 483.2M732.2 427.9Q731.5 470.0 709.0 505.7M750.8 408.4Q760.4 426.8 778.3 437.5M750.8 408.4Q740.0 449.4 709.6 478.8M750.8 408.4Q753.0 433.6 768.0 454.0M750.8 408.4Q760.7 45 e nommable ; la firme centrale est nommée par le titre du panneau. Ce sont des vues locales : un voisinage petit ne veut pas dire une firme périphérique, il veut dire que le reste est coupé, et la ligne sous chaque panneau indique combien. Deux nœuds distincts portent ici le nom « Banque de l&#x27;Indochine » : c&#x27;est la dette de doublons de sociétés que signale le codebook, laissée visible plutôt que corrigée à la main dans une figure.</figcaption><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1340 806" width="1340" height="806" role="img" aria-label="Six voisinages, nœud par nœud"><title>Six voisinages, nœud par nœud</title><rect width="1340" height="806" fill="var(--surface)"/><g transform="translate(0.0,0.0)"><g fill="none" stroke-linecap="round"><path d="M347.0 232.5Q263.4 292.3 160.9 300.0M347.0 232.5Q317.6 218.5 299.7 191.3M83.0 146.4Q173.9 109.1 232.3 30.0M83.0 146.4Q91.9 195.9 125.3 233.6M104.3 293.0Q145.1 218.7 141.2 134.0M224.3 255.6Q288.9 261.2 347.0 232.5M224.3 255.6Q165.7 206.4 141.2 134.0M224.3 255.6Q296.0 209.6 333.3 133.0M229.1 121.3Q272.5 193.4 347.0 232.5M229.1 121.3Q159.6 154.3 83.0 146.4M229.1 121.3Q243.5 76.1 232.3 30.0M229.1 121.3Q218.0 163.4 186.6 193.7M229.1 121.3Q192.9 192.0 125.3 233.6M229.1 121.3Q249.4 139.6 276.3 144.7M229.1 121.3Q254.6 166.2 299.7 191.3M229.1 121.3Q279.6 141.7 333.3 133.0M186.6 193.7Q261.4 235.5 347.0 232.5M186.6 193.7Q128.2 184.5 83.0 146.4M186.6 193.7Q159.4 254.9 104.3 293.0M186.6 193.7Q232.4 118.2 232.3 30.0M186.6 193.7Q161.5 222.2 125.3 233.6M186.6 193.7Q206.0 128.5 188.7 62.8M141.2 134.0Q201.3 94.7 232.3 30.0M141.2 134.0Q147.2 186.0 125.3 233.6M141.2 134.0Q212.5 184.8 299.7 191.3M125.3 233.6Q218.4 236.9 299.7 191.3M276.3 144.7Q238.2 93.5 232.3 30.0M276.3 144.7Q207.3 158.2 141.2 134.0M276.3 144.7Q213.2 210.3 125.3 233.6M276.3 144.7Q272.1 207.1 300.9 262.7M333.3 133.0Q268.4 95.6 232.3 30.0M188.7 62.8Q147.5 119.4 83.0 146.4M188.7 62.8Q174.9 105.0 141.2 134.0M188.7 62.8Q251.2 118.1 333.3 133.0" stroke="var(--
