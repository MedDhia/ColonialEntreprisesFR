</style><h1>Le réseau, nœud par nœud</h1><p class="lede">Les autres pages montrent la forme de l&#x27;ensemble. Celle-ci montre des graphes assez petits pour qu&#x27;on puisse nommer chaque firme, suivre chaque lien, et voir de quoi le réseau est fait.</p><button onclick="document.documentElement.dataset.theme=document.documentElement.dataset.theme==='dark'?'light':'dark'">Basculer le thème</button><figure id="fig28_backbone"><h2 style="font-size:16px;margin:0 0 2px">L&#x27;ossature du réseau, firme par firme</h2><figcaption>Les 52 firmes les plus liées du graphe à trois administrateurs partagés ou plus — le seuil au-delà duquel le réseau ne tient plus par des liens à un seul nom (figure 21). L&#x27;aire d&#x27;un nœud est son degré pondéré et sa couleur son territoire ; un lien unissant deux territoires différents est tracé plus sombre et plus épais — 126 des 179 liens dessinés. La distinction est un pas de gris et non une teinte : les teintes sont déjà prises par les territoires, et la même couleur ne peut pas dire deux choses dans une figure. Les noms qui ne tenaient pas sont dans le tableau.</figcaption><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1340 738" width="1340" height="738" role="img" aria-label="L&#x27;ossature du réseau, firme par firme"><title>L&#x27;ossature du réseau, firme par firme</title><rect width="1340" height="738" fill="var(--surface)"/><g fill="none" stroke-linecap="round"><path d="M808.0 620.9Q839.0 633.2 872.0 627.7M952.8 405.2Q882.0 432.3 807.3 418.7M712.4 337.4Q748.5 391.3 807.3 418.7M965.4 458.3Q880.8 460.6 807.3 418.7M891.5 194.5Q915.5 225.3 951.9 239.2M759.0 410.0Q768.9 495.8 732.9 574.3M759.0 410.0Q823.5 380.8 863.5 322.3M807.3 418.7Q900.6 426.3 984.2 384.4M824.9 526.4Q785.6 563.2 732.9 574.3M612.8 183.9Q559.7 207.2 502.2 199.6M612.8 183.9Q551.4 220.5 480.0 219.9M578.4 226.3Q602.7 183.0 600.9 133.3M578.4 226.3Q543.4 203.0 525.7 164.9M578.4 226.3Q563.8 181.1 574.8 134.9M578.4 226.3Q543.7 171.4 542.5 106.5M502.2 199.6Q493.9 2 e les touche toutes les deux. C&#x27;est aussi pourquoi une seule personne mal résolue déplace beaucoup d&#x27;arêtes. Les deux colonnes sont ordonnées pour minimiser les croisements et non par un regroupement imposé ici : que les firmes indochinoises se retrouvent en haut et les marocaines en bas est un résultat de cet ordre, pas une donnée d&#x27;entrée. Les identifiants sans initiale — « paris » — sont des noms de famille seuls que la résolution n&#x27;a pas pu rattacher, et non des personnes ; ils restent visibles.</figcaption><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1340 938" width="1340" height="938" role="img" aria-label="Comment se fabrique un interlock"><title>Comment se fabrique un interlock</title><rect width="1340" height="938" fill="var(--surface)"/><g fill="none" stroke-linecap="round"><path d="M330.0 713.6Q644.8 735.2 960.0 719.1M330.0 713.6Q654.8 568.7 960.0 385.9M330.0 713.6Q647.1 696.8 960.0 642.2M330.0 713.6Q644.1 748.0 960.0 744.7M330.0 713.6Q643.3 760.8 960.0 770.3M330.0 713.6Q646.4 709.6 960.0 667.8M330.0 713.6Q645.6 722.4 960.0 693.4M330.0 713.6Q647.9 684.0 960.0 616.6M330.0 713.6Q642.5 773.7 960.0 795.9M330.0 713.6Q641.8 786.5 960.0 821.6M330.0 713.6Q641.0 799.3 960.0 847.2M330.0 362.1Q650.4 290.4 960.0 180.9M330.0 362.1Q649.7 303.3 960.0 206.6M330.0 362.1Q643.5 405.8 960.0 411.6M330.0 362.1Q654.3 226.4 960.0 52.8M330.0 362.1Q652.7 252.0 960.0 104.1M330.0 362.1Q652.0 264.8 960.0 129.7M330.0 362.1Q640.4 457.0 960.0 514.1M330.0 362.1Q645.8 367.3 960.0 334.7M330.0 362.1Q639.7 469.8 960.0 539.7M330.0 362.1Q648.9 316.1 960.0 232.2M330.0 362.1Q642.7 418.6 960.0 437.2M330.0 362.1Q645.1 380.1 960.0 360.3M330.0 362.1Q653.5 239.2 960.0 78.4M330.0 362.1Q638.9 482.6 960.0 565.3M330.0 362.1Q638.1 495.4 960.0 590.9M330.0 420.7Q652.2 319.7 960.0 180.9M330.0 420.7Q651.4 332.5 960.0 206.6M330.0 420.7Q656.0 255.7 960.0 52.8M330.0 420.7Q643.0 473.5 960.0 488.4M330.0 420.7Q642.2 486.3 960.0 514.1M330.0 420.7Q647.6 396.6 960.0 334.7M330.0 420.7Q641.4
