e ordinaire</text><circle cx="167.0" cy="417.8" r="5" fill="#eb6834"/><text x="178.0" y="422.0">graphe complet (artefact)</text></g><g font-size="11.5" font-family="ui-sans-serif,system-ui,sans-serif" fill="#8a8983"><text x="0" y="453.5">Firmes par coquille de k-cœur : une firme est au niveau k si elle a k voisins qui en ont eux-mêmes k. Le profil devrait décroître régulièrement ; il ne le fait pas. Les</text><text x="0" y="468.5">coquilles k=46, k=71 sont des graphes *complets* — chaque firme y est liée à toutes les autres, ce qu&#x27;aucun conseil d&#x27;administration réel ne produit. Ce sont des notices</text><text x="0" y="483.5">fusionnées et des mandats cumulés, que seule cette décomposition rend visibles. Les niveaux vides entre k=46 et k=71 sont réels : rien n&#x27;occupe ce palier, le cœur</text><text x="0" y="498.5">profond est détaché du reste du graphe. La figure 26 le démonte.</text></g></svg>