" y="452.0">tous les liens</text><circle cx="135.8" cy="447.8" r="5" fill="#eb6834"/><text x="146.8" y="452.0">≥ 2 administrateurs partagés</text></g><g font-size="11.5" font-family="ui-sans-serif,system-ui,sans-serif" fill="#8a8983"><text x="0" y="483.5">Distribution complémentaire cumulée du degré, en échelles logarithmiques. Le degré maximal passe de 499 à 164 lorsqu&#x27;on exige deux administrateurs partagés au lieu</text><text x="0" y="498.5">d&#x27;un : la connectivité extrême du graphe complet est en grande partie faite de liens à un seul nom. Les deux courbes s&#x27;infléchissent vers le bas plutôt que de suivre une</text><text x="0" y="513.5">droite : la queue est plus courte qu&#x27;une loi de puissance, il y a donc une échelle caractéristique — ce réseau n&#x27;est pas « sans échelle », et un exposant ajusté sur ces</text><text x="0" y="528.5">données décrirait la source autant que la structure (voir figure 8).</text></g></svg>